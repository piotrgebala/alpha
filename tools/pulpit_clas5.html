<script>
(function () {
  'use strict';
  // Nonce tego skryptu (CSP platformy). Tylko synchronicznie: currentScript istnieje wyłącznie

  }
  window.addEventListener('hashchange', function () {
    var i = zAdresu();

  });

  // Start: #dziennik / #tokeny / #mapa / #radar w adresie > ostatnio wybrana zakładka > Dziennik.
  var start = zAdresu();
  if (start < 0) {
    try { start = ZAKLADKI.indexOf(localStorage.getItem(KLUCZ)); } catch (e) { start = -1; }
  }
  wybierz(start < 0 ? 0 : start, {});
})();

s5.html pod adres pulpitu. Odtworzone 2026-09-28 z opublikowanej wersji (bez opakowania\n     platformy; poza tym komentarzem bajt w bajt). -->\n\u003cstyle>\n:root {\n  --bg: #f4f6f9; --card: #ffffff; --soft: #eef1f6; --line: #e3e7ee;\n  --ink: #111827; --ink-2: #4b5563; --ink-3: #7b8494;\n  --accent: #1d6fe0; --main: #1d6fe0; --aux: #d97706;\n  --good: #15803d; --good-bg: #e3f6e9;\n  --warn: #a15c00; --warn-bg: #fdf1d8;\n  --bad: #c62828; --bad-bg: #fde6e6;\n  --v1: #cfe3fb; --v2: #7fb0ef; --v3: #1d5fbf;\n  --carry: #27a3b2;\n  --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 4px 16px rgba(17, 24, 39, .05);\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #0d1117; --card: #161b22; --soft: #1d242e; --line: #29313c;\n    --ink: #e8edf3; --ink-2: #aab4c2; --ink-3: #7f8a99;\n    --accent: #5aa2ff; --main: #5aa2ff; --aux: #f5a524;\n    --good: #5bd68a; --good-bg: #12301f;\n    --warn: #f4c15d; --warn-bg: #33270d;\n    --bad: #ff8a80; --bad-bg: #3a1716;\n    --v1: #213652; --v2: #3b6db2; --v3: #8cbcff;\n    --carry: #058d9b;\n    --shadow: none;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #0d1117; --card: #161b22; --soft: #1d242e; --line: #29313c;\n  --ink: #e8edf3; --ink-2: #aab4c2; --ink-3: #7f8a99;\n  --accent: #5aa2ff; --main: #5aa2ff; --aux: #f5a524;\n  --good: #5bd68a; --good-bg: #12301f;\n  --warn: #f4c15d; --warn-bg: #33270d;\n  --bad: #ff8a80; --bad-bg: #3a1716;\n  --v1: #213652; --v2: #3b6db2; --v3: #8cbcff;\n  --carry: #058d9b;\n  --shadow: none;\n}\n* { box-sizing: border-box; }\nbody { background: var(--bg); color: var(--ink); font: 16px/1.55 \"Geist\", system-ui, -apple-system, \"Segoe UI\", sans-serif; }\n.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 28px; }\nh1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.015em; }\nh2 { font-size: 21px; font-weight: 700; }\nh3 { font-size: 16px; font-weight: 600; }\np { margin: 0; max-width: 66ch; }\n.num { font-family: \"Geist Mono\", ui-monospace, \"SFMono-Regular\", monospace; font-variant-numeric: tabular-nums; }\n.muted { color: var(--ink-2); }\n.hint { color: var(--ink-3); font-size: 14px; }\nsection { display: grid; gap: 14px; }\n.sec-head { display: grid; gap: 4px; }\n\n.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }\n.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }\n.brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }\n.brand i svg { width: 16px; height: 16px; }\n.fresh { font-size: 13px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }\n\n.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; align-content: start; }\n\n.hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }\n.hero .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; }\n.hero .ico svg { width: 26px; height: 26px; }\n.hero h1 { font-size: clamp(22px, 4.6vw, 32px); font-weight: 700; line-height: 1.15; }\n.hero .todo { margin-top: 10px; display: inline-flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }\n.hero .todo b { font-weight: 600; }\n.t-ok .ico { background: var(--good-bg); color: var(--good); }\n.t-warn .ico { background: var(--warn-bg); color: var(--warn); }\n.t-bad .ico { background: var(--bad-bg); color: var(--bad); }\n.t-bad { border-color: var(--bad); }\n\n.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }\n@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; align-content: start; }\n.kpi .l { font-size: 13px; color: var(--ink-2); }\n.kpi .v { font: 600 26px/1.15 \"Geist Mono\", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }\n.kpi .s { font-size: 13px; color: var(--ink-3); }\n.pos-v { color: var(--good); } .neg-v { color: var(--bad); }\n\n.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n@media (max-width: 700px) { .checks { grid-template-columns: 1fr; } }\n.check { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }\n.dot { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }\n.dot svg { width: 18px; height: 18px; }\n.dot.ok { background: var(--good-bg); color: var(--good); }\n.dot.warn { background: var(--warn-bg); color: var(--warn); }\n.dot.bad { background: var(--bad-bg); color: var(--bad); }\n.check b { display: block; font-weight: 600; }\n.check span.d { font-size: 14px; color: var(--ink-2); }\n\n.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }\n.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }\n.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }\n.tag.ok { background: var(--good-bg); color: var(--good); }\n.tag.warn { background: var(--warn-bg); color: var(--warn); }\n.tag.bad { background: var(--bad-bg); color: var(--bad); }\n.tag.info { background: var(--soft); color: var(--ink-2); }\n.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }\n.money { font: 600 30px/1.1 \"Geist Mono\", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }\n.money small { font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }\n\n.spark { width: 100%; height: 110px; display: block; }\n.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }\n.empty { font-size: 14px; color: var(--ink-3); padding: 12px; background: var(--soft); border-radius: 10px; }\n\n.meter { display: grid; gap: 6px; }\n.meter .track { position: relative; height: 10px; border-radius: 999px; background: var(--soft); }\n.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; min-width: 4px; }\n.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; }\n.meter .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }\n\n.progress .bar { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }\n.progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }\n\n.list { display: grid; gap: 0; }\n.list .it { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }\n.list .it:last-child { border-bottom: 0; }\n.list .it b { font-weight: 600; display: block; }\n.list .it span.d { font-size: 14px; color: var(--ink-2); }\n\n.bet { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--soft); }\n.bet b { font-weight: 600; }\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chips span { font: 500 13px/1 \"Geist Mono\", ui-monospace, monospace; padding: 7px 9px; border-radius: 8px; background: var(--soft); white-space: nowrap; }\n.chips span.l { color: var(--good); } .chips span.s { color: var(--bad); }\n.chips span.l::before { content: \"▲ \"; } .chips span.s::before { content: \"▼ \"; }\n.lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }\n\n.strip { display: flex; flex-wrap: wrap; gap: 4px; }\n.strip span { width: 26px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; color: var(--ink); }\n.strip .v1 { background: var(--v1); } .strip .v2 { background: var(--v2); } .strip .v3 { background: var(--v3); color: var(--card); }\n.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); }\n.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }\n\n.tablewrap { overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; }\nth, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }\ntr:last-child td { border-bottom: 0; }\nth { font-weight: 600; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }\ntd.nw { white-space: nowrap; }\n\ndetails { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }\ndetails summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }\ndetails summary::-webkit-details-marker { display: none; }\ndetails summary::after { content: \"+\"; color: var(--ink-3); font-weight: 500; }\ndetails[open] summary::after { content: \"−\"; }\ndetails[open] summary { margin-bottom: 12px; }\nsummary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }\ndl { margin: 0; display: grid; gap: 12px; }\ndt { font-weight: 600; }\ndd { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }\nfooter { font-size: 13px; color: var(--ink-3); display: grid; gap: 4px; }\n.state { padding: 40px 0; color: var(--ink-2); }\n\u003c/style>\n\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"topbar\">\n    \u003cdiv class=\"brand\">\u003ci aria-hidden=\"true\">\u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M2 12l4-4 3 3 5-6\"/>\u003c/svg>\u003c/i>Dziennik CLAS-5\u003c/div>\n    \u003cspan class=\"fresh\" id=\"fresh\">wczytuję…\u003c/span>\n  \u003c/div>\n  \u003cdiv id=\"app\">\u003cp class=\"state\">Wczytuję stan dziennika…\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst HOSTS = { dantey1: \"serwer\", pitgeb: \"Twój komputer\" };\nconst hostName = h => h ? (HOSTS[h] || h) : \"nieznana maszyna\";\nconst esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst nf = (x, d = 1) => x == null || Number.isNaN(x) ? \"—\" : x.toLocaleString(\"pl-PL\", { minimumFractionDigits: d, maximumFractionDigits: d });\nconst pct = (x, d = 1, sign = false) => x == null ? \"—\" : (sign && x > 0 ? \"+\" : \"\") + nf(x * 100, d) + \" %\";\nconst MONTHS = [\"stycznia\", \"lutego\", \"marca\", \"kwietnia\", \"maja\", \"czerwca\", \"lipca\", \"sierpnia\", \"września\", \"października\", \"listopada\", \"grudnia\"];\nconst longDate = iso => { if (!iso) return \"—\"; const [y, m, d] = iso.slice(0, 10).split(\"-\").map(Number); return `${d} ${MONTHS[m - 1]}`; };\nconst short = iso => { if (!iso) return \"—\"; const [, m, d] = iso.slice(0, 10).split(\"-\"); return `${d}.${m}`; };\nconst warsawDay = t => new Intl.DateTimeFormat(\"sv-SE\", { timeZone: \"Europe/Warsaw\" }).format(t);\nconst hm = iso => new Intl.DateTimeFormat(\"pl-PL\", { timeZone: \"Europe/Warsaw\", hour: \"2-digit\", minute: \"2-digit\" }).format(new Date(iso));\nfunction when(iso) {\n  if (!iso) return \"—\";\n  const d = warsawDay(new Date(iso)), today = warsawDay(new Date()), yest = warsawDay(new Date(Date.now() - 86400000));\n  const day = d === today ? \"dziś\" : d === yest ? \"wczoraj\" : longDate(d);\n  return `${day}, ${hm(iso)}`;\n}\nconst dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);\nconst sym = s => esc(String(s).replace(/USDT$/, \"\"));\nconst ICON = {\n  ok: '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/>\u003c/svg>',\n  warn: '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M12 7v6\"/>\u003ccircle cx=\"12\" cy=\"17\" r=\".6\" fill=\"currentColor\"/>\u003cpath d=\"M10.3 3.9L2.6 17.5A2 2 0 004.3 20.5h15.4a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z\"/>\u003c/svg>',\n  bad: '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\">\u003cpath d=\"M7 7l10 10M17 7L7 17\"/>\u003c/svg>',\n};\nconst ddLevel = (dd, th) => dd == null ? \"info\" : dd >= th.stop ? \"bad\" : dd >= th.warn ? \"warn\" : \"ok\";\n// Odmiana po liczebniku: odm(n, \"przebieg\", \"przebiegi\", \"przebiegów\") — 1 / 2–4 (też 22–24…) / 5+ i 12–14.\nconst odm = (n, one, few, many) => n === 1 ? one : n % 10 >= 2 && n % 10 \u003c= 4 && (n % 100 \u003c 12 || n % 100 > 14) ? few : many;\n// Kłopot nogi carry (poprawka 12) po ludzku. Zwraca zwykły tekst — kto go wstawia do HTML, sam woła esc().\nconst CARRY_TROUBLE_TXT = { \"spóźnione\": \"dane o opłatach są spóźnione\", \"brak pliku\": \"brak pliku z danymi o opłatach\" };\nconst carryTrouble = s => (s || \"\").split(\", \").filter(Boolean).map(part => {\n  if (CARRY_TROUBLE_TXT[part]) return CARRY_TROUBLE_TXT[part];\n  const m = /^BŁĄD (.+)$/.exec(part);\n  return m ? `błąd liczenia albo zapisu (${m[1]})` : part;\n}).join(\", \");\n\nfunction status(D) {\n  const ageH = (Date.now() - Date.parse(D.generated_at)) / 3600000;\n  const H = D.health, C = D.criteria;\n  const r1 = ddLevel(D.r1.drawdown.at(-1), D.thresholds.r1), x1 = D.x1 ? ddLevel(D.x1.drawdown.at(-1), D.thresholds.x1) : \"ok\";\n  if (ageH > 30) return [\"bad\", `Strona nie odświeżyła się od ${Math.round(ageH)} godzin`, \"Liczby poniżej mogą być nieaktualne.\", \"sprawdź zadanie odświeżania strony w zaplanowanych zadaniach.\"];\n  if (H.latest_as_of !== D.expected_as_of) return [\"bad\", `Dziennik nie policzył się za ${longDate(D.expected_as_of)}`, \"Ostatnie obliczenie jest starsze, niż powinno.\", \"sprawdź, czy serwer działa i czy zapisuje dziennik do repo.\"];\n  if (r1 === \"bad\" || x1 === \"bad\") return [\"bad\", \"Spadek przekroczył próg STOP\", \"Tak duży spadek zapisano z góry jako moment decyzji.\", \"zdecyduj, czy przerwać test. Dziennik sam się nie wyłączy.\"];\n  if (C.consistency.after_first_result > 0) return [\"bad\", \"Dziennik zmienił wcześniej zapisane liczby\", \"Raz zapisane pozycje i wyniki nie powinny się zmieniać.\", \"trzeba znaleźć przyczynę przed odczytem 25 grudnia.\"];\n  if (r1 === \"warn\" || x1 === \"warn\") return [\"warn\", \"Spadek przekroczył próg ostrzeżenia\", \"Portfel stracił więcej niż w najgorszym okresie w historii testów.\", \"nic pilnego. Obserwuj; decyzja zapada dopiero przy progu STOP.\"];\n  if (H.hosts_last_day.length > 1) return [\"warn\", \"Wszystko działa, ale dziennik policzyły dwie maszyny\", `${longDate(H.last_journal_date)} obliczenie zrobił i serwer, i Twój komputer. Wyniki wyszły takie same.`, \"nic, jeśli od następnej nocy liczy już tylko serwer.\"];\n  const car = D.carry;\n  if (car?.error) return [\"warn\", \"Nie da się odczytać wyników carry\", `Plik z wynikami osobnej nogi carry ma nieoczekiwany kształt (${car.error}). Reszta dziennika liczy się normalnie.`, \"sprawdź plik carry_wyniki.csv i najbliższe obliczenie.\"];\n  if (D.last_run?.carry) return [\"warn\", \"Wszystko działa, ale noga carry ma kłopot\", `Ostatnie obliczenie zgłosiło: ${carryTrouble(D.last_run.carry)}. Portfele liczą się normalnie.`, \"nic pilnego. Jeśli kłopot powtórzy się jutro, sprawdź pobieranie danych o opłatach z Binance.\"];\n  if (car && car.criteria.consistency.last > car.criteria.consistency.prev) return [\"warn\", \"Noga carry: zapis różni się od przeliczenia\", \"Ostatnie przeliczenie stawek funding nie zgadza się z tym, co już zapisano w carry_wyniki.csv.\", \"trzeba wyjaśnić przyczynę przed odczytem 25 grudnia, np. czy giełda poprawiła stawkę.\"];\n  return [\"ok\", \"Wszystko działa\", \"Dziennik liczy się sam każdej nocy i nic nie wymaga Twojej uwagi.\", \"nic.\"];\n}\n\nfunction spark(dates, eq, color) {\n  const vals = (eq || []).map(v => v ?? NaN);\n  if (vals.filter(Number.isFinite).length \u003c 2) return `\u003cp class=\"empty\">Wykres pojawi się od drugiego dnia z wynikiem.\u003c/p>`;\n  const W = 300, H = 100, P = 6;\n  const fin = vals.filter(Number.isFinite), lo = Math.min(1, ...fin), hi = Math.max(1, ...fin);\n  const pad = (hi - lo) * .15 || .002, y0 = lo - pad, y1 = hi + pad;\n  const X = i => P + i * (W - 2 * P) / (vals.length - 1), Y = v => H - P - (v - y0) * (H - 2 * P) / (y1 - y0);\n  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`), n = vals.length - 1;\n  return `\u003csvg class=\"spark\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Wartość 100 zł w czasie\">\n    \u003cline x1=\"0\" x2=\"${W}\" y1=\"${Y(1)}\" y2=\"${Y(1)}\" stroke=\"var(--ink-3)\" stroke-dasharray=\"3 4\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"/>\n    \u003cpath d=\"M${X(0)},${Y(1)} L${pts.join(\" L\")} L${X(n)},${Y(1)} Z\" fill=\"${color}\" fill-opacity=\".12\"/>\n    \u003cpolyline points=\"${pts.join(\" \")}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    \u003ccircle cx=\"${X(n)}\" cy=\"${Y(vals[n])}\" r=\"4\" fill=\"${color}\" stroke=\"var(--card)\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"/>\n  \u003c/svg>\u003cdiv class=\"axis\">\u003cspan>${esc(short(dates[0]))}\u003c/span>\u003cspan>przerywana linia = 100 zł na starcie\u003c/span>\u003cspan>${esc(short(dates[n]))}\u003c/span>\u003c/div>`;\n}\n\nfunction meter(dd, th) {\n  const lvl = ddLevel(dd, th), col = { ok: \"var(--good)\", warn: \"var(--warn)\", bad: \"var(--bad)\", info: \"var(--ink-3)\" }[lvl];\n  const w = Math.min(100, Math.max(0, (dd || 0) / th.stop * 100));\n  return `\u003cdiv class=\"meter\">\u003cdiv class=\"row\">\u003cspan class=\"muted\">Spadek od najwyższego stanu\u003c/span>\u003cspan class=\"num\">\u003cb>${pct(dd || 0)}\u003c/b>\u003c/span>\u003c/div>\n    \u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${w}%;background:${col}\">\u003c/div>\u003cdiv class=\"tick\" style=\"left:${th.warn / th.stop * 100}%;background:var(--warn)\">\u003c/div>\u003cdiv class=\"tick\" style=\"right:0;background:var(--bad)\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"lab\">\u003cspan>0 %\u003c/span>\u003cspan>ostrzeżenie przy ${pct(th.warn)}\u003c/span>\u003cspan>STOP przy ${pct(th.stop)}\u003c/span>\u003c/div>\u003c/div>`;\n}\n\nfunction portfolioCard({ name, about, color, s, th, start }) {\n  const has = s && s.equity && s.equity.length;\n  const eq = has ? s.equity.at(-1) : null, dd = has ? s.drawdown.at(-1) : null;\n  const lvl = has ? ddLevel(dd, th) : \"info\";\n  const tag = { ok: \"w normie\", warn: \"ostrzeżenie\", bad: \"STOP\", info: \"czeka na pierwszy wynik\" }[lvl];\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"row\">\u003ch3>\u003cspan class=\"swatch\" style=\"background:${color}\">\u003c/span>${name}\u003c/h3>\u003cspan class=\"tag ${lvl}\">${tag}\u003c/span>\u003c/div>\n    \u003cp class=\"hint\">${about}\u003c/p>\n    ${has ? `\u003cdiv class=\"money\">${nf(eq * 100, 2)} zł \u003csmall>z każdych 100 zł · ${pct(eq - 1, 2, true)}\u003c/small>\u003c/div>\n      ${meter(dd, th)}${spark(s.dates, s.equity, color)}`\n      : `\u003cp class=\"empty\">Wynik liczy się od ${longDate(start)}. Pierwsza liczba pojawi się po nocnym obliczeniu, które zamknie ten dzień.\u003c/p>`}\n  \u003c/div>`;\n}\n\n// Karta nogi carry COIN-M (poprawka 12, tylko zapis — dziennik/README.md). D.carry brak = stary\n// generator jeszcze nie zaktualizowany; D.carry.error = plik carry_wyniki.csv nieczytelny.\nfunction carryCard(D) {\n  const about = \"Na papierze: 1 bitcoin kupiony na giełdzie i taki sam zakład na jego spadek w kontrakcie rozliczanym w bitcoinach. Zmiany ceny się znoszą, zostaje sama opłata funding, którą strony kontraktu płacą sobie co 8 godzin. Bez dźwigni, zawsze w pozycji — tylko do sprawdzenia, czy zapis zgadza się z giełdą.\";\n  const swatch = `\u003cspan class=\"swatch\" style=\"background:var(--carry)\">\u003c/span>`;\n  const c = D.carry;\n\n  if (!c) {\n    return `\u003cdiv class=\"card\">\n      \u003cdiv class=\"row\">\u003ch3>${swatch}Carry COIN-M\u003c/h3>\u003c/div>\n      \u003cp class=\"hint\">${about}\u003c/p>\n      \u003cp class=\"empty\">Ta część pojawi się po aktualizacji automatu, który odświeża stronę.\u003c/p>\n    \u003c/div>`;\n  }\n  if (c.error) {\n    return `\u003cdiv class=\"card\">\n      \u003cdiv class=\"row\">\u003ch3>${swatch}Carry COIN-M\u003c/h3>\u003cspan class=\"tag warn\">błąd odczytu\u003c/span>\u003c/div>\n      \u003cp class=\"hint\">${about}\u003c/p>\n      \u003cp class=\"empty\">Nie udało się odczytać pliku wyników carry (${esc(c.error)}). Reszta strony jest aktualna.\u003c/p>\n    \u003c/div>`;\n  }\n\n  const last = D.last_run || {};\n  const tim = c.criteria.timeliness, comp = c.criteria.completeness, cons = c.criteria.consistency;\n  let tag;\n  if (last.carry) tag = `\u003cspan class=\"tag warn\">kłopot\u003c/span>`;\n  else if (cons.last > 0) tag = `\u003cspan class=\"tag warn\">różnica w zapisie\u003c/span>`;\n  else if (!c.dates.length) tag = `\u003cspan class=\"tag info\">czeka na pierwszy wynik\u003c/span>`;\n  else tag = `\u003cspan class=\"tag info\">tylko zapis\u003c/span>`;\n\n  let body;\n  if (c.dates.length) {\n    const eq = 1 + c.cum.at(-1);\n    const eqSeries = c.cum.map(v => v == null ? null : 1 + v);\n    body = `\u003cdiv class=\"money\">${nf(eq * 100, 2)} zł \u003csmall>z każdych 100 zł · ${pct(eq - 1, 2, true)}\u003c/small>\u003c/div>\n      ${spark(c.dates, eqSeries, \"var(--carry)\")}\n      \u003cp class=\"hint\">Ostatni dzień (${longDate(c.dates.at(-1))}): ${c.settlements.at(-1)} z 3 rozliczeń, opłata ${pct(c.funding.at(-1), 3, true)}.\u003c/p>`;\n  } else {\n    body = `\u003cp class=\"empty\">Wynik liczy się od ${longDate(c.start)}. Pierwsza liczba pojawi się po nocnym obliczeniu, które zamknie ten dzień.\u003c/p>`;\n  }\n\n  const timOk = tim.runs ? tim.trouble / tim.runs \u003c= 0.05 : null;\n  const compDays = comp.days + comp.missing.length;  // dni od startu: brakujący wiersz = dzień niepełny\n  const compOk = compDays ? comp.complete / compDays >= 0.95 : null;\n  const consOk = cons.runs === 0;\n  let compExtra = \"\";\n  if (comp.incomplete.length || comp.missing.length) {\n    const bits = [];\n    if (comp.incomplete.length) bits.push(`niepełne: ${comp.incomplete.map(short).join(\", \")}`);\n    if (comp.missing.length) bits.push(`brakujące: ${comp.missing.map(short).join(\", \")}`);\n    compExtra = `\u003cspan class=\"d\" style=\"display:block\">${esc(bits.join(\" · \"))}\u003c/span>`;\n  }\n  const critRow = (k, v, w, ok, extra = \"\") => `\u003cdiv class=\"it\">\u003cspan>\u003cb>${k}\u003c/b>\u003cspan class=\"d\">\u003cspan class=\"num\">${esc(v)}\u003c/span> · wymóg: ${w}\u003c/span>${extra}\u003c/span>\u003cspan class=\"tag ${ok == null ? \"info\" : ok ? \"ok\" : \"warn\"}\">${ok == null ? \"czeka\" : ok ? \"spełnia\" : \"do sprawdzenia\"}\u003c/span>\u003c/div>`;\n  const crit = `\u003cdiv class=\"list\">\n    ${critRow(\"Na czas\", tim.runs ? `${tim.runs - tim.trouble} z ${tim.runs} ${tim.runs === 1 ? \"przebiegu\" : \"przebiegów\"} bez kłopotu` : \"—\", \"kłopot najwyżej w 5 % przebiegów od 30 września\", timOk)}\n    ${critRow(\"Komplet rozliczeń\", compDays ? `${comp.complete} z ${compDays} ${compDays === 1 ? \"dnia\" : \"dni\"} po 3 rozliczenia` : \"—\", \"co najmniej 95 % dni, każdy brak wyjaśniony\", compOk, compExtra)}\n    ${critRow(\"Zapis zgodny z giełdą\", cons.runs ? `${cons.runs} ${odm(cons.runs, \"przebieg\", \"przebiegi\", \"przebiegów\")} z różnicą (najwięcej ${cons.max} ${cons.max === 1 ? \"dzień\" : \"dni\"})` : \"bez różnic\", \"zero różnic\", consOk)}\n  \u003c/div>`;\n\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"row\">\u003ch3>${swatch}Carry COIN-M\u003c/h3>${tag}\u003c/div>\n    \u003cp class=\"hint\">${about}\u003c/p>\n    ${body}\n    ${crit}\n  \u003c/div>`;\n}\n\nfunction render(D) {\n  const H = D.health, C = D.criteria, P = D.positions, L = D.last_run, T = D.thresholds;\n  document.getElementById(\"fresh\").textContent = `odświeżono ${when(D.generated_at)}`;\n  const [lvl, title, why, todo] = status(D);\n  const hero = `\u003cdiv class=\"hero t-${lvl}\">\u003cdiv class=\"ico\">${ICON[lvl]}\u003c/div>\u003cdiv>\u003ch1>${esc(title)}\u003c/h1>\u003cp class=\"muted\" style=\"margin-top:6px\">${esc(why)}\u003c/p>\u003cdiv class=\"todo\">\u003cb>Co zrobić:\u003c/b>\u003cspan>${esc(todo)}\u003c/span>\u003c/div>\u003c/div>\u003c/div>`;\n\n  // --- liczby na górze\n  const total = dayDiff(D.start.r1, D.start.reading), day = Math.max(0, Math.min(total, dayDiff(D.start.r1, D.expected_as_of) + 1));\n  const r1eq = D.r1.equity.at(-1), x1eq = D.x1?.equity.at(-1);\n  const cls = v => v == null ? \"\" : v > 1 ? \"pos-v\" : v \u003c 1 ? \"neg-v\" : \"\";\n  const kpis = `\u003cdiv class=\"kpis\">\n    \u003cdiv class=\"kpi\">\u003cspan class=\"l\">Portfel główny\u003c/span>\u003cspan class=\"v ${cls(r1eq)}\">${r1eq == null ? \"—\" : pct(r1eq - 1, 2, true)}\u003c/span>\u003cspan class=\"s\">od ${longDate(D.start.r1)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"kpi\">\u003cspan class=\"l\">Portfel pomocniczy\u003c/span>\u003cspan class=\"v ${cls(x1eq)}\">${x1eq == null ? \"—\" : pct(x1eq - 1, 2, true)}\u003c/span>\u003cspan class=\"s\">${x1eq == null ? \"pierwszy wynik wkrótce\" : \"od \" + longDate(D.start.x1)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"kpi\">\u003cspan class=\"l\">Największy spadek (główny)\u003c/span>\u003cspan class=\"v\">${pct(Math.max(0, ...D.r1.drawdown.filter(v => v != null)), 1)}\u003c/span>\u003cspan class=\"s\">ostrzeżenie przy ${pct(T.r1.warn)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"kpi\">\u003cspan class=\"l\">Dzień testu\u003c/span>\u003cspan class=\"v\">${day}\u003cspan style=\"font-size:15px;color:var(--ink-3)\"> / ${total}\u003c/span>\u003c/span>\u003cspan class=\"s\">podsumowanie ${longDate(D.start.reading)}\u003c/span>\u003c/div>\n  \u003c/div>`;\n\n  // --- czy wszystko działa\n  const fresh = H.latest_as_of === D.expected_as_of, srcOk = L && L.binance === L.as_of && L.premia === L.as_of;\n  const pre = H.history_events.filter(e => e.before_first_result).length, after = C.consistency.after_first_result;\n  const oneHost = H.hosts_last_day.length \u003c= 1;\n  const checks = [\n    [fresh ? \"ok\" : \"bad\", \"Dziennik policzył się dziś\",\n      fresh ? `Ostatnie obliczenie: ${when(L?.ts)}, na cenach z końca dnia ${longDate(H.latest_as_of)}.`\n            : `Brakuje obliczenia na cenach z ${longDate(D.expected_as_of)}. Ostatnie jest z ${longDate(H.latest_as_of)}.`],\n    [srcOk ? \"ok\" : \"warn\", \"Ceny z giełd są aktualne\",\n      srcOk ? \"Binance i Coinbase dostarczyły ceny z właściwego dnia.\" : `Binance ma ceny do ${longDate(L?.binance)}, Coinbase do ${longDate(L?.premia)}.`],\n    [after ? \"bad\" : \"ok\", \"Stare zapisy się nie zmieniły\",\n      after ? `${after} ${after === 1 ? \"raz\" : \"razy\"} dziennik zmienił coś, co już zapisał. To trzeba wyjaśnić.`\n        : `Raz zapisane pozycje i wyniki zostają bez zmian, tak jak powinny.${pre ? ` (${pre} ${odm(pre, \"zmiana\", \"zmiany\", \"zmian\")} z ${longDate(H.history_events[0].ts)} ${odm(pre, \"była\", \"były\", \"było\")} jeszcze przed pierwszym wynikiem, w czasie przygotowań.)` : \"\"}`],\n    [oneHost ? \"ok\" : \"warn\", \"Liczy tylko jedna maszyna\",\n      oneHost ? `Ostatnio policzył: ${hostName(H.hosts_last_day[0])}.`\n        : `${longDate(H.last_journal_date)} policzyli: ${H.hosts_last_day.map(hostName).join(\" i \")}. Wynik wyszedł ten sam, ale docelowo ma liczyć tylko serwer.`],\n  ];\n  const checksHtml = `\u003cdiv class=\"checks\">${checks.map(([c, h, d]) => `\u003cdiv class=\"check\">\u003cspan class=\"dot ${c}\">${ICON[c]}\u003c/span>\u003cspan>\u003cb>${h}\u003c/b>\u003cspan class=\"d\">${esc(d)}\u003c/span>\u003c/span>\u003c/div>`).join(\"\")}\u003c/div>`;\n\n  // --- portfele\n  const portfolios = `\u003cdiv class=\"two\">\n    ${portfolioCard({ name: \"Portfel główny\", color: \"var(--main)\", s: D.r1, th: T.r1, start: D.start.r1,\n      about: \"Dwie strategie razem: podążanie za trendem na 20 największych monetach i zakład na Bitcoina według tego, czy na amerykańskiej giełdzie Coinbase płaci się za niego ostatnio więcej niż zwykle.\" })}\n    ${portfolioCard({ name: \"Portfel pomocniczy\", color: \"var(--aux)\", s: D.x1, th: T.x1, start: D.start.x1,\n      about: \"Osobny test: kupuje 5 monet, które ostatnio rosły najmocniej, i gra na spadek 5 najsłabszych. Liczony oddzielnie, bez pożyczonych pieniędzy.\" })}\n  \u003c/div>\n  \u003cp class=\"hint\">Wszystko jest „na papierze”: żadne prawdziwe pieniądze nie biorą udziału. Progi ostrzeżenia i STOP zapisano przed startem. Pierwsze tygodnie to w dużej mierze przypadek — o wyniku nie da się jeszcze nic powiedzieć.\u003c/p>`;\n\n  // --- egzamin\n  const comp = C.completeness, tim = C.timeliness, mg = C.margin, km = C.k_max, share = (a, b) => b ? a / b : null;\n  const crit = [\n    [\"Liczył się codziennie\", comp.days ? `${comp.covered} z ${comp.days} dni` : \"—\", \"co najmniej 95 % dni\", share(comp.covered, comp.days) >= .95],\n    [\"Ceny były na czas\", tim.days ? `${tim.days - tim.late.length} z ${tim.days} dni` : \"—\", \"co najmniej 95 % dni\", share(tim.days - tim.late.length, tim.days) >= .95],\n    [\"Stare zapisy bez zmian\", after ? `${after} ${odm(after, \"zmiana\", \"zmiany\", \"zmian\")}` : \"bez zmian\", \"zero niewyjaśnionych zmian\", !after],\n    [\"Zablokowane środki w normie\", mg.median == null ? \"—\" : `średnio ${pct(mg.median, 0)} kapitału`, \"od 15 do 35 %\", mg.median != null && mg.median >= .15 && mg.median \u003c= .35],\n    [\"Ryzyko w limicie\", `maks. ${nf(Math.max(km.trend ?? 0, km.coinbase ?? 0), 2)}`, `nie więcej niż ${nf(km.cap, 0)}`, Math.max(km.trend ?? 0, km.coinbase ?? 0) \u003c= km.cap],\n  ];\n  const exam = `\u003cdiv class=\"card\">\n    \u003cdiv class=\"progress\">\u003cdiv class=\"row\" style=\"margin-bottom:8px\">\u003cb>Dzień ${day} z ${total}\u003c/b>\u003cspan class=\"hint\">podsumowanie ${longDate(D.start.reading)}\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci style=\"width:${day / total * 100}%\">\u003c/i>\u003c/div>\u003c/div>\n    \u003cdiv class=\"list\">${crit.map(([k, v, w, ok]) => `\u003cdiv class=\"it\">\u003cspan>\u003cb>${k}\u003c/b>\u003cspan class=\"d\">\u003cspan class=\"num\">${esc(v)}\u003c/span> · wymóg: ${w}\u003c/span>\u003c/span>\u003cspan class=\"tag ${ok ? \"ok\" : \"warn\"}\">${ok ? \"spełnia\" : \"do sprawdzenia\"}\u003c/span>\u003c/div>`).join(\"\")}\u003c/div>\n  \u003c/div>\n  \u003cp class=\"hint\">„Zablokowane środki” to część kapitału, którą giełda trzyma jako zabezpieczenie otwartych pozycji. „Ryzyko” to mnożnik, którym system dzieli ryzyko między strategie — nie może przekroczyć 2.\u003c/p>`;\n\n  // --- pozycje\n  let positions = `\u003cp class=\"empty\">Brak pozycji w danych.\u003c/p>`;\n  if (P) {\n    const cb = P.cb, tr = P.trend, dir = cb.exposure > 0 ? \"kupuje\" : cb.exposure \u003c 0 ? \"gra na spadek\" : \"nie ma pozycji na\";\n    const chip = ([s, v], d = 1) => `\u003cspan class=\"${v > 0 ? \"l\" : \"s\"}\">${sym(s)} ${nf(Math.abs(v) * 100, d)}\u003c/span>`;\n    positions = `\u003cdiv class=\"two\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"row\">\u003ch3>\u003cspan class=\"swatch\" style=\"background:var(--main)\">\u003c/span>Portfel główny\u003c/h3>\u003c/div>\n        \u003cdiv class=\"bet\">\u003cb>Bitcoin: ${dir} za ${pct(Math.abs(cb.exposure), 0)} kapitału\u003c/b>\u003cspan class=\"hint\">Zakład według różnicy cen Coinbase i reszty rynku. Zablokowane środki: ${pct(cb.margin, 0)}.\u003c/span>\u003c/div>\n        \u003cdiv class=\"bet\">\u003cb>Trend: ${tr.long} monet na wzrost, ${tr.short} na spadek\u003c/b>\u003cspan class=\"hint\">Łącznie przewaga zakładów na wzrost ${pct(tr.net, 0)} kapitału. Zablokowane środki: ${pct(tr.margin_phases, 0)}.\u003c/span>\u003c/div>\n        \u003cspan class=\"lbl\">największe pozycje trendu\u003c/span>\n        \u003cdiv class=\"chips\">${tr.top_long.slice(0, 8).map(z => chip(z)).join(\"\")}${tr.top_short.slice(0, 3).map(z => chip(z)).join(\"\")}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"row\">\u003ch3>\u003cspan class=\"swatch\" style=\"background:var(--aux)\">\u003c/span>Portfel pomocniczy\u003c/h3>\u003c/div>\n        ${P.x1 ? `\u003cspan class=\"lbl\">kupuje (najmocniejsze)\u003c/span>\u003cdiv class=\"chips\">${P.x1.long.map(z => chip(z)).join(\"\")}\u003c/div>\n          \u003cspan class=\"lbl\">gra na spadek (najsłabsze)\u003c/span>\u003cdiv class=\"chips\">${P.x1.short.map(z => chip(z)).join(\"\")}\u003c/div>`\n          : `\u003cp class=\"empty\">Brak pozycji na ten dzień.\u003c/p>`}\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"hint\">▲ zakład na wzrost, ▼ zakład na spadek. Liczba to procent kapitału danego portfela. Każdy portfel dzieli się na 7 części i codziennie odnawia jedną z nich, dlatego pozycje zmieniają się stopniowo.\u003c/p>\n    \u003cdetails>\u003csummary>Nowe zlecenia na ${longDate(P.for_day)} (${P.orders.length})\u003c/summary>\n      \u003cdiv class=\"chips\">${P.orders.map(o => chip([o.sym, o.exp], 2)).join(\"\")}\u003c/div>\n      \u003cp class=\"hint\" style=\"margin-top:10px\">To pozycje części portfela, która odnawia się dziś. Liczba to procent kapitału portfela głównego.\u003c/p>\n    \u003c/details>`;\n  }\n\n  // --- carry (poprawka 12, osobna noga tylko do zapisu)\n  const carrySec = `${carryCard(D)}\n    \u003cp class=\"hint\">Pierwszego dnia wynik obciąża koszt wejścia 0,19 %, więc na początku jest pod kreską. Przy stawkach z lat 2022–2026 (średnio 5,7 % rocznie; bony skarbowe USA dały w tym czasie 3,95 %) koszt odrabia się w około 2 tygodnie, w słabym roku w ponad miesiąc. Po 3 miesiącach sprawdzamy tylko, czy zapis działa — nie to, czy carry się opłaca.\u003c/p>`;\n\n  // --- rynek\n  const M = D.market, mood = { niska: \"spokojny\", srednia: \"normalny\", wysoka: \"nerwowy\" };\n  const market = M && M.dates.length ? `\u003cdiv class=\"card\">\n    \u003cdiv class=\"two\" style=\"gap:10px\">\n      \u003cdiv class=\"bet\">\u003cspan class=\"hint\">Rynek jest teraz\u003c/span>\u003cb style=\"font-size:20px\">${mood[M.stan.at(-1)] || \"—\"}\u003c/b>\u003cspan class=\"hint\">Bitcoin waha się o ${pct(M.vol30.at(-1), 0)} w skali roku\u003c/span>\u003c/div>\n      \u003cdiv class=\"bet\">\u003cspan class=\"hint\">Bitcoin w ostatnich 3 miesiącach\u003c/span>\u003cb style=\"font-size:20px\">${M.trend90.at(-1) > 0 ? \"w górę\" : M.trend90.at(-1) \u003c 0 ? \"w dół\" : \"bez zmian\"} ${pct(M.r90.at(-1), 0, true)}\u003c/b>\u003cspan class=\"hint\">stan na ${longDate(M.dates.at(-1))}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cspan class=\"lbl\">dzień po dniu\u003c/span>\n    \u003cdiv class=\"strip\" role=\"img\" aria-label=\"Nastrój rynku dzień po dniu\">${M.dates.map((d, i) => `\u003cspan class=\"${{ niska: \"v1\", srednia: \"v2\", wysoka: \"v3\" }[M.stan[i]] || \"\"}\" title=\"${short(d)}: ${mood[M.stan[i]] || \"—\"}\">${M.trend90[i] > 0 ? \"▲\" : M.trend90[i] \u003c 0 ? \"▼\" : \"·\"}\u003c/span>`).join(\"\")}\u003c/div>\n    \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--v1)\">\u003c/i>spokojny\u003c/span>\u003cspan>\u003ci style=\"background:var(--v2)\">\u003c/i>normalny\u003c/span>\u003cspan>\u003ci style=\"background:var(--v3)\">\u003c/i>nerwowy\u003c/span>\u003cspan>▲▼ kierunek Bitcoina z 3 miesięcy\u003c/span>\u003c/div>\n  \u003c/div>` : `\u003cp class=\"empty\">Pierwszy wpis pojawi się po najbliższym nocnym obliczeniu.\u003c/p>`;\n  const marketNote = `\u003cp class=\"hint\">Tylko notatka, nie wpływa na pozycje. Po kilku miesiącach pokaże, która strategia radzi sobie przy spokojnym, a która przy nerwowym rynku.\u003c/p>`;\n\n  // --- historia\n  const runs = [...D.log_tail].reverse();\n  const x1note = s => /BŁĄD/.test(s || \"\") ? \"błąd portfela pomocniczego\" : \"\";\n  const note = r => [r.changed ? `zmieniono ${r.changed} ${odm(r.changed, \"stary zapis\", \"stare zapisy\", \"starych zapisów\")}` : \"\", x1note(r.x1), /BŁĄD/.test(r.stan || \"\") ? \"błąd notatki o rynku\" : \"\", r.status !== \"OK\" ? r.status : \"\", r.carry ? `carry: ${carryTrouble(r.carry)}` : \"\", r.carry_changed ? `carry różni się od zapisu w ${r.carry_changed} ${r.carry_changed === 1 ? \"dniu\" : \"dniach\"}` : \"\"].filter(Boolean).join(\", \") || \"w porządku\";\n  const history = `\u003cdiv class=\"card\" style=\"padding:6px 6px\">\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kiedy\u003c/th>\u003cth>Ceny z dnia\u003c/th>\u003cth>Portfel główny\u003c/th>\u003cth>Uwagi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${runs.map(r => `\u003ctr>\u003ctd class=\"nw\">${when(r.ts)}\u003c/td>\u003ctd class=\"nw\">${short(r.as_of)}\u003c/td>\u003ctd class=\"num\">${r.eq == null ? \"—\" : nf(r.eq * 100, 2) + \" zł\"}\u003c/td>\u003ctd style=\"${r.changed ? \"color:var(--bad)\" : \"\"}\">${esc(note(r))}\u003c/td>\u003c/tr>`).join(\"\")}\n  \u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n  \u003cdetails>\u003csummary>Kto zapisał dziennik (${D.commits.length})\u003c/summary>\n    \u003cdiv class=\"list\">${D.commits.map(c => `\u003cdiv class=\"it\">\u003cspan>\u003cb>${longDate(c.date)}\u003c/b>\u003cspan class=\"d\">${esc(hostName(c.host))}, zapis ${when(c.ts)}\u003c/span>\u003c/span>${H.double_days.includes(c.date) ? '\u003cspan class=\"tag warn\">dwie maszyny\u003c/span>' : \"\"}\u003c/div>`).join(\"\")}\u003c/div>\n  \u003c/details>`;\n\n  const glossary = `\u003cdetails>\u003csummary>Słowniczek\u003c/summary>\u003cdl>\n    \u003cdiv>\u003cdt>Dziennik papierowy\u003c/dt>\u003cdd>Codzienny zapis, co zrobiłby system, gdyby grał prawdziwymi pieniędzmi. Pozycje zapisuje się przed poznaniem wyniku, żeby nie dało się niczego poprawić po fakcie.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Ceny z końca dnia\u003c/dt>\u003cdd>Obliczenie w nocy korzysta z cen zamknięcia poprzedniego dnia (według czasu UTC, czyli o 2:00 w nocy w Polsce latem).\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Spadek od najwyższego stanu\u003c/dt>\u003cdd>O ile procent portfel jest poniżej swojego najlepszego dotychczasowego wyniku.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Ostrzeżenie i STOP\u003c/dt>\u003cdd>Ostrzeżenie to najgorszy spadek z historycznych testów. STOP to 1,5 raza więcej — wtedy decydujesz, czy przerwać.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Premia Coinbase\u003c/dt>\u003cdd>Różnica między ceną Bitcoina na amerykańskiej giełdzie Coinbase a resztą świata. Gdy w ostatnim tygodniu ta różnica jest wyższa niż średnio z ostatnich 3 miesięcy, system kupuje Bitcoina; gdy niższa, gra na spadek.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Trend\u003c/dt>\u003cdd>Moneta, która rosła przez ostatnie 4 tygodnie, dostaje zakład na wzrost; która spadała — na spadek.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>7 części portfela\u003c/dt>\u003cdd>Portfel jest podzielony na 7 kawałków, a codziennie odnawia się tylko jeden. Dzięki temu wynik nie zależy od jednego dnia tygodnia.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Carry (opłata funding)\u003c/dt>\u003cdd>Kontrakt bez daty wygaśnięcia (kontrakt wieczysty) ma opłatę funding: co 8 godzin jedna strona płaci drugiej. Zwykle płacą grający na wzrost ceny, a dostają grający na spadek. Bitcoin kupiony na giełdzie znosi zmiany jego ceny, więc z całej pozycji zostaje sama ta opłata. Opłata bywa ujemna — wtedy trzeba zapłacić, zamiast dostać.\u003c/dd>\u003c/div>\n    \u003cdiv>\u003cdt>Podsumowanie 25 grudnia\u003c/dt>\u003cdd>Po 3 miesiącach sprawdzamy, czy dziennik działał porządnie. Czy strategia zarabia, będzie można ocenić dopiero po dłuższym czasie.\u003c/dd>\u003c/div>\n  \u003c/dl>\u003c/details>`;\n\n  const stale = (Date.now() - Date.parse(D.generated_at)) / 3600000 > 30;\n  document.getElementById(\"app\").innerHTML = `\u003cdiv style=\"display:grid;gap:28px\">\n    ${hero}${kpis}\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Czy wszystko działa?\u003c/h2>\u003cp class=\"hint\">Cztery rzeczy, które muszą grać, żeby dziennikowi można było wierzyć.\u003c/p>\u003c/div>${checksHtml}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Ile jest warte 100 zł\u003c/h2>\u003cp class=\"hint\">Co stałoby się ze 100 zł wpłaconymi na start każdego portfela.\u003c/p>\u003c/div>${portfolios}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Podsumowanie 25 grudnia\u003c/h2>\u003cp class=\"hint\">Po 3 miesiącach sprawdzamy, czy dziennik działał porządnie. Tak wygląda to dziś.\u003c/p>\u003c/div>${exam}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Co portfele trzymają ${P ? \"na \" + longDate(P.for_day) : \"\"}\u003c/h2>\u003cp class=\"hint\">Pozycje wyliczone z cen z końca ${P ? longDate(P.as_of) : \"dnia\"}.\u003c/p>\u003c/div>${positions}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Carry — sprawdzian zapisu\u003c/h2>\u003cp class=\"hint\">Osobna noga od 29 września: tylko zapis opłaty funding, bez wpływu na portfele.\u003c/p>\u003c/div>${carrySec}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Nastrój rynku\u003c/h2>\u003cp class=\"hint\">Krótka notatka o tym, jaki był rynek każdego dnia.\u003c/p>\u003c/div>${market}${marketNote}\u003c/section>\n    \u003csection>\u003cdiv class=\"sec-head\">\u003ch2>Historia obliczeń\u003c/h2>\u003cp class=\"hint\">Każde nocne obliczenie dziennika, najnowsze na górze.\u003c/p>\u003c/div>${history}\u003c/section>\n    ${glossary}\n    \u003cfooter>\u003cspan>Dane z plików dziennika w repozytorium projektu, pobierane raz dziennie około 8:30.${stale ? \" Ostatnie odświeżenie się nie udało.\" : \"\"}\u003c/span>\u003cspan>Strona tylko pokazuje dziennik — niczego nie liczy od nowa i niczego w nim nie zmienia.\u003c/span>\u003c/footer>\n  \u003c/div>`;\n}\n\nfunction showState(title, text) {\n  document.getElementById(\"fresh\").textContent = \"brak danych\";\n  document.getElementById(\"app\").innerHTML = `\u003cdiv class=\"hero t-warn\">\u003cdiv class=\"ico\">${ICON.warn}\u003c/div>\u003cdiv>\u003ch1>${esc(title)}\u003c/h1>\u003cp class=\"muted\" style=\"margin-top:6px\">${esc(text)}\u003c/p>\u003c/div>\u003c/div>`;\n}\n\n(async () => {\n  const db = window.claude && window.claude.use ? await window.claude.use(\"db\") : null;\n  if (!db) return showState(\"Nie mogę wczytać danych\", \"Ten widok nie ma dostępu do danych strony. Otwórz ją w Claude jako zalogowany użytkownik.\");\n  db.doc(\"dziennik/stan\").onSnapshot(\n    snap => {\n      if (!snap.exists) return showState(\"Czekam na pierwsze odświeżenie\", \"Dane dziennika pojawią się po najbliższym odświeżeniu strony.\");\n      try { render(snap.data()); } catch (e) { showState(\"Nie udało się pokazać danych\", \"Zapisane dane mają nieoczekiwany kształt: \" + e.message); }\n    },\n    () => showState(\"Nie udało się wczytać danych\", \"Odśwież stronę za chwilę.\")\n  );\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>\n"</script>
<script type="application/json" id="strona-tokeny">"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003cscript>\n/* Preludium pulpitu CLAS-5 (tools/pulpit_clas5.py): pierwszy skrypt dokumentu zakładki. */\n(function () {\n  'use strict';\n  var w = window, d = document, p = null;\n  try { if (w.parent && w.parent !== w) p = w.parent; } catch (e) { p = null; }\n  if (!p) return;\n  // (a) Runtime platformy: ta sama przestrzeń nazw co u rodzica, bez opakowania. Funkcje zostają\n  //     w realmie rodzica, więc odczyty bazy strony idą przez stronę-rodzica.\n  try { if (!w.claude && p.claude) w.claude = p.claude; } catch (e) { /* brak dostępu do rodzica */ }\n  // (b) Motyw: data-theme z \u003chtml> rodzica (brak u rodzica = brak tutaj).\n  try {\n    var t = p.document.documentElement.getAttribute('data-theme');\n    if (t === null) d.documentElement.removeAttribute('data-theme');\n    else d.documentElement.setAttribute('data-theme', t);\n  } catch (e) { /* zostaje motyw systemowy */ }\n  // (c) Linki. Zewnętrzny: nowa karta przez tymczasowy link w dokumencie rodzica (tam działa obsługa\n  //     linków przeglądarki artefaktu), awaryjnie window.open. Kotwica „#…”: przewinięcie tutaj.\n  function otworz(url) {\n    try {\n      var pd = p.document, a = pd.createElement('a');\n      a.href = url; a.target = '_blank'; a.rel = 'noopener';\n      (pd.body || pd.documentElement).appendChild(a);\n      a.click();\n      a.parentNode.removeChild(a);\n      return;\n    } catch (e) { /* awaryjnie niżej */ }\n    try { w.open(url, '_blank', 'noopener'); } catch (e) { /* nic więcej się nie da */ }\n  }\n  function kotwica(frag) {\n    var id = frag, el = null;\n    try { id = decodeURIComponent(frag); } catch (e) { id = frag; }\n    if (id) el = d.getElementById(id) || d.getElementsByName(id)[0] || null;\n    if (!el) { if (!id || id.toLowerCase() === 'top') w.scrollTo(0, 0); return; }\n    var m = parseFloat(w.getComputedStyle(el).scrollMarginTop) || 0;\n    w.scrollTo(0, el.getBoundingClientRect().top + w.pageYOffset - m);\n  }\n  try {\n    d.addEventListener('click', function (e) {\n      try {\n        if (e.defaultPrevented || e.button !== 0) return;\n        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n        if (!a || a.hasAttribute('download')) return;\n        var href = a.getAttribute('href') || '';\n        if (href.charAt(0) === '#') { e.preventDefault(); kotwica(href.slice(1)); return; }\n        var url = new URL(href, d.baseURI).href;\n        if (/^javascript:/i.test(url)) return;\n        e.preventDefault();\n        otworz(url);\n      } catch (err) { /* zostaje zwykłe zachowanie linku */ }\n    }, true);\n  } catch (e) { /* bez przechwytywania linków */ }\n})();\n\u003c/script>\u003c/head>\u003cbody>\n\u003ctitle>Tokeny CLAS-5\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n\u003c!-- Źródło strony „Tokeny CLAS-5” — zakładka „Tokeny” strony „Pulpit CLAS-5” (adres w docs/rag/12). Dane:\n     dokument bazy tokeny/stan, zapisywany codziennie przez tools/odswiez_tokeny.sh (cron serwera). Zmiana\n     strony = edycja tego pliku, python3 tools/pulpit_clas5.py i publikacja tools/pulpit_clas5.html pod adres\n     pulpitu. Styl: szwajcarska siatka użytkownika. -->\n\u003cstyle>\n:root{\n  --bg:#FFFFFF; --ink:#141414; --muted:#6A6A66; --hair:#E4E4E0;\n  --accent:#C41E24; --s2:#2E6DA8; --good:#2F7D4F; --bad:#C41E24;\n  --band:rgba(20,20,20,.05);\n  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;\n  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#17181A; --ink:#ECECE8; --muted:#9A9A96; --hair:#2A2B2E;\n  --accent:#E4574D; --s2:#4E97DB; --good:#5CAF7F; --bad:#E4574D; --band:rgba(236,236,232,.06);\n  color-scheme:dark;}}\n:root[data-theme=\"dark\"]{\n  --bg:#17181A; --ink:#ECECE8; --muted:#9A9A96; --hair:#2A2B2E;\n  --accent:#E4574D; --s2:#4E97DB; --good:#5CAF7F; --bad:#E4574D; --band:rgba(236,236,232,.06);\n  color-scheme:dark;}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;padding-inline:20px;padding-block:0 56px;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans)}\n.wrap{max-width:1080px;margin:0 auto}\nheader{padding-top:40px}\nh1{margin:0;font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}\n.meta{margin-top:8px;font:400 12px/1.6 var(--mono);color:var(--muted)}\n.fresh{margin-top:10px;display:flex;align-items:center;gap:8px;font:500 12px/1.4 var(--mono)}\n.fresh i{flex:none;width:8px;height:8px;background:var(--good)}\n.fresh.stale{color:var(--bad)}\n.fresh.stale i{background:var(--bad)}\np{margin:0;max-width:65ch}\n.lede{margin-top:16px}\n.msg{margin-top:40px;padding-block:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}\n.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 32px;margin-top:32px}\n.kpi{border-top:1px solid var(--hair);padding-top:12px;min-width:0}\n.kpi .v{font:600 32px/1.1 var(--mono);font-variant-numeric:tabular-nums}\n.kpi .u{margin-top:6px;font-size:12px;color:var(--muted)}\n.kpi .d{margin-top:8px;font-size:12px;color:var(--muted)}\n.mix{display:flex;gap:2px;height:8px;margin-top:10px}\n.mix span{display:block;height:100%;min-width:2px}\n.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:48px;padding-top:16px;border-top:1px solid var(--hair)}\n.lab{font:600 11px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\nh2.lab{margin:48px 0 14px;padding-top:16px;border-top:1px solid var(--hair)}\n.seg{display:flex}\n.seg button{font:500 12px/1 var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--hair);border-bottom-width:2px;padding:8px 12px;cursor:pointer;margin-left:-1px}\n.seg button:first-child{margin-left:0}\n.seg button:hover{color:var(--ink)}\n.seg button[aria-pressed=\"true\"]{color:var(--ink);border-bottom-color:var(--accent)}\n.seg button:focus-visible{outline:2px solid var(--s2);outline-offset:2px}\n.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:10px;font-size:12px;color:var(--muted)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend .axis{margin-left:auto;font-family:var(--mono);font-size:11px}\n.sw{flex:none;display:inline-block;vertical-align:middle}\n.chart{margin:0;min-height:140px}\n.chart svg{display:block;max-width:100%}\n.chart text{font:400 11px var(--mono);fill:var(--muted)}\n.chart text.ref{font-size:10.5px}\n.note{margin-top:12px;font-size:12.5px;color:var(--muted)}\n.tw{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:13px}\nth{font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 16px 8px 0;border-bottom:1px solid var(--hair);white-space:nowrap}\ntd{padding:7px 16px 7px 0;border-bottom:1px solid var(--hair);white-space:nowrap}\nth:last-child,td:last-child{padding-right:0}\ntd.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}\ntd .id{color:var(--muted);font:400 11px var(--mono);margin-left:6px}\ntr.part td{color:var(--muted)}\nfooter{margin-top:56px;padding-top:16px;border-top:1px solid var(--hair);font:400 11.5px/1.8 var(--mono);color:var(--muted)}\nfooter p{max-width:none}\n#tip{position:fixed;left:0;top:0;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font:400 12px/1.5 var(--mono);padding:8px 10px;opacity:0;transition:opacity .12s;min-width:180px;max-width:320px}\n#tip b{font-weight:600}\n#tip .r{display:flex;justify-content:space-between;gap:16px}\n@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:480px){h1{font-size:24px}.kpi .v{font-size:26px}.kpis{grid-template-columns:1fr}.legend .axis{margin-left:0}}\n@media (prefers-reduced-motion:reduce){#tip{transition:none}}\n\u003c/style>\n\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\" focusable=\"false\">\n  \u003cdefs>\n    \u003cpattern id=\"g-hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n      \u003crect width=\"6\" height=\"6\" style=\"fill:var(--bg)\">\u003c/rect>\u003crect width=\"2.5\" height=\"6\" style=\"fill:var(--muted)\">\u003c/rect>\n    \u003c/pattern>\n    \u003cpattern id=\"g-hatch2\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(135)\">\n      \u003crect width=\"6\" height=\"6\" style=\"fill:var(--bg)\">\u003c/rect>\u003crect width=\"2.5\" height=\"6\" style=\"fill:var(--s2)\">\u003c/rect>\n    \u003c/pattern>\n  \u003c/defs>\n\u003c/svg>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Tokeny CLAS-5\u003c/h1>\n    \u003cdiv class=\"meta\" id=\"meta\">Claude Code · projekt alpha · serwer Linux\u003c/div>\n    \u003cdiv class=\"fresh\" id=\"fresh\" hidden>\u003ci>\u003c/i>\u003cspan>\u003c/span>\u003c/div>\n    \u003cp class=\"lede\">Ile tokenów zużywa praca Claude Code nad projektem alpha, dzień po dniu, według modelu i źródła.\n      Koszt jest liczony w jednostkach wejścia. Każdy token waży tyle, ile w cenniku Claude: odczyt z pamięci\n      podręcznej 0,1, zapis 2, odpowiedź 5. To proporcje do porównań, nie złotówki.\u003c/p>\n  \u003c/header>\n\n  \u003cp class=\"msg\" id=\"msg\">Wczytuję dane z bazy strony…\u003c/p>\n\n  \u003cmain id=\"main\" hidden>\n    \u003csection class=\"kpis\" id=\"kpis\" aria-label=\"Najważniejsze liczby\">\u003c/section>\n\n    \u003cdiv class=\"bar\">\n      \u003cspan class=\"lab\">Okres wykresów i tabel\u003c/span>\n      \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Okres\">\n        \u003cbutton type=\"button\" id=\"p7\" data-n=\"7\">7 dni\u003c/button>\n        \u003cbutton type=\"button\" id=\"p30\" data-n=\"30\">30 dni\u003c/button>\n        \u003cbutton type=\"button\" id=\"p90\" data-n=\"90\">90 dni\u003c/button>\n        \u003cbutton type=\"button\" id=\"p0\" data-n=\"0\">całość\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003ch2 class=\"lab\">Zużycie dzienne według modelu\u003c/h2>\n    \u003cdiv class=\"legend\" id=\"lg1\">\u003c/div>\n    \u003cfigure class=\"chart\" id=\"c1\">\u003c/figure>\n    \u003cp class=\"note\">Jednostki są takie same dla każdego modelu, ale cena za token nie. Fable kosztuje więcej\n      niż Opus, a Sonnet i Haiku wyraźnie mniej. Realny udział Fable w limicie jest więc większy, niż pokazuje\n      wykres. Dzisiejszy słupek jest jaśniejszy, bo dzień jeszcze trwa.\u003c/p>\n\n    \u003ch2 class=\"lab\">Modele w wybranym okresie\u003c/h2>\n    \u003cdiv class=\"tw\">\u003ctable id=\"t-mod\">\u003c/table>\u003c/div>\n\n    \u003ch2 class=\"lab\">Skąd koszt: główna sesja, workflow, subagenci\u003c/h2>\n    \u003cdiv class=\"legend\" id=\"lg2\">\u003c/div>\n    \u003cfigure class=\"chart\" id=\"c2\">\u003c/figure>\n    \u003cp class=\"note\" id=\"src-note\">\u003c/p>\n\n    \u003ch2 class=\"lab\">Kontekst na wywołanie w głównej sesji\u003c/h2>\n    \u003cdiv class=\"legend\" id=\"lg3\">\u003c/div>\n    \u003cfigure class=\"chart\" id=\"c3\">\u003c/figure>\n    \u003cp class=\"note\">Każde wywołanie modelu czyta cały dotychczasowy kontekst rozmowy, więc długa sesja\n      oznacza drogie wywołania. Świeża sesja zaczyna od około 90 tys. tokenów. Po 300 tys. Claude Code\n      streszcza rozmowę. Nowa sesja na nowe zadanie trzyma tę linię nisko.\u003c/p>\n\n    \u003ch2 class=\"lab\">Dzień po dniu\u003c/h2>\n    \u003cdiv class=\"tw\">\u003ctable id=\"t-days\">\u003c/table>\u003c/div>\n  \u003c/main>\n\n  \u003cfooter>\n    \u003cp>Źródło: zapisy rozmów Claude Code projektu alpha na serwerze Linux (~/.claude/projects). Komputer\n      z Windows i Cowork mają własne zapisy, więc ich tu nie ma.\u003c/p>\n    \u003cp>Odświeżanie: codziennie. O 04:30 UTC cron serwera uruchamia tools/odswiez_tokeny.sh: monitor\n      tools/zuzycie_tokenow.py --stan liczy dni i wypycha plik stan.json (same liczby) na gałąź tokeny-dane\n      publicznego repo. O 05:00 UTC rutyna Cowork przepisuje go do bazy tej strony.\u003c/p>\n    \u003cp>Wagi jednostek: wejście 1 · zapis cache 5 min 1,25 · zapis cache 1 h 2 · odczyt cache 0,1 · wyjście 5.\n      Dni starsze niż 14 są zamrożone w runs/tokeny/stan.json, bo Claude Code kasuje zapisy po 30 dniach.\u003c/p>\n    \u003cp>Zasady oszczędzania i pierwszy pomiar: docs/rag/12_zuzycie_tokenow.md.\u003c/p>\n  \u003c/footer>\n\u003c/div>\n\u003cdiv id=\"tip\">\u003c/div>\n\n\u003cscript>\n(function () {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const NS = 'http://www.w3.org/2000/svg';\n  const nf = (a, b) => new Intl.NumberFormat('pl-PL', { minimumFractionDigits: a, maximumFractionDigits: b });\n  const F0 = nf(0, 0), F1 = nf(1, 1), F01 = nf(0, 1);\n  const WD = ['niedz.', 'pon.', 'wt.', 'śr.', 'czw.', 'pt.', 'sob.'];\n  const esc = (s) => String(s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const mln = (v) => F1.format(v / 1e6);\n  const tok = (v) => (v >= 1e6 ? F1.format(v / 1e6) + ' mln' : v >= 1e3 ? F0.format(v / 1e3) + ' tys.' : F0.format(v));\n  const pc = (x) => { const p = 100 * x; return (p > 0 && p \u003c 10 ? F1.format(p) : F0.format(p)) + ' %'; };\n  const dm = (d) => d.slice(8, 10) + '.' + d.slice(5, 7);\n  const wd = (d) => WD[new Date(d + 'T00:00:00Z').getUTCDay()] + ' ' + dm(d);\n  const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };\n  const row = (a, b) => '\u003cdiv class=\"r\">\u003cspan>' + esc(a) + '\u003c/span>\u003cspan>' + esc(b) + '\u003c/span>\u003c/div>';\n\n  // Rodziny modeli: kolejność = kolejność w stosie (od dołu) i w legendzie. Kolor idzie za rodziną.\n  const FAMS = [\n    { key: 'opus', label: 'Opus', fill: 'var(--s2)' },\n    { key: 'fable', label: 'Fable', fill: 'var(--accent)' },\n    { key: 'sonnet', label: 'Sonnet', fill: 'url(#g-hatch)' },\n    { key: 'haiku', label: 'Haiku', fill: 'var(--muted)' },\n    { key: 'inne', label: 'Inne', fill: 'url(#g-hatch2)' },\n  ];\n  const SRCS = [\n    { key: 'main', label: 'Główna sesja', fill: 'var(--s2)' },\n    { key: 'wf', label: 'Workflow', fill: 'var(--accent)' },\n    { key: 'sub', label: 'Subagenci', fill: 'var(--muted)' },\n  ];\n  function modelName(id) {\n    const m = /^claude-([a-z]+)-(\\d+)(?:-(\\d{1,2}))?(?:-\\d{8})?$/.exec(id);\n    if (!m) return { fam: 'inne', name: id };\n    const f = FAMS.find((x) => x.key === m[1]);\n    const base = f ? f.label : m[1].charAt(0).toUpperCase() + m[1].slice(1);\n    return { fam: f ? f.key : 'inne', name: base + ' ' + m[2] + (m[3] ? '.' + m[3] : '') };\n  }\n  const famOf = (k) => FAMS.find((f) => f.key === k);\n  const swatch = (fill) => '\u003csvg class=\"sw\" width=\"8\" height=\"8\" aria-hidden=\"true\">\u003crect width=\"8\" height=\"8\" style=\"fill:' + fill + '\">\u003c/rect>\u003c/svg>';\n\n  let S = null;      // dane po przygotowaniu\n  let CUR = null;    // dni wybranego okresu\n  let MA = new Map();\n  let period = 30;\n  const PKEY = 'tokeny-clas5-okres';\n  try { const raw = localStorage.getItem(PKEY); if (raw !== null && [7, 30, 90, 0].includes(+raw)) period = +raw; } catch (e) { /* brak pamięci przeglądarki */ }\n\n  function prep(doc) {\n    const gen = String(doc.wygenerowano || '');\n    const today = gen.slice(0, 10);\n    if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(today)) return null;\n    const rows = (Array.isArray(doc.dni) ? doc.dni : [])\n      .filter((r) => r && typeof r.d === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(r.d))\n      .sort((a, b) => (a.d \u003c b.d ? -1 : 1));\n    if (!rows.length) return null;\n    const first = rows[0].d;\n    const last = rows[rows.length - 1].d > today ? rows[rows.length - 1].d : today;\n    const by = new Map(rows.map((r) => [r.d, r]));\n    const days = [];\n    for (let d = first; d \u003c= last; d = addDays(d, 1)) {\n      const r = by.get(d) || {};\n      const fam = {}, src = {}, models = {};\n      let total = 0, calls = 0;\n      for (const [id, v] of Object.entries(r.m || {})) {\n        if (!Array.isArray(v)) continue;\n        const nums = v.map((x) => +x || 0);\n        total += nums[0]; calls += nums[1];\n        const f = modelName(id).fam;\n        fam[f] = (fam[f] || 0) + nums[0];\n        models[id] = nums;\n      }\n      for (const [k, v] of Object.entries(r.z || {})) if (Array.isArray(v)) src[k] = +v[0] || 0;\n      const ctx = Array.isArray(r.ctx) && +r.ctx[0] > 0 ? [+r.ctx[0], +r.ctx[1] || 0] : null;\n      const prz = Array.isArray(r.prz) ? [+r.prz[0] || 0, +r.prz[1] || 0] : [0, 0];\n      const mainCalls = r.z && Array.isArray(r.z.main) ? +r.z.main[1] || 0 : 0;\n      days.push({ d, partial: d === today, total, calls, fam, src, models, ctx, prz, ses: +r.ses || 0, mainCalls });\n    }\n    return { gen, today, first, days };\n  }\n\n  function movingAvg() {\n    const m = new Map();\n    S.days.forEach((x, i) => {\n      if (x.partial || i \u003c 6) return;\n      let s = 0;\n      for (let j = i - 6; j \u003c= i; j++) s += S.days[j].total;\n      m.set(x.d, s / 7);\n    });\n    return m;\n  }\n\n  function range(from, to, f) {\n    let s = 0, n = 0;\n    for (const Width - 8) x = Math.max(8, e.clientX - w - 14);\n    if (y \u003c 8) y = e.clientY + 18;\n    tip.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';\n  }\n  function hideTip() { tip.style.opacity = '0'; }\n  // dotyk: podpowiedź zostaje do stuknięcia poza wykresem\n  document.addEventListener('pointerdown', (e) => {\n    if (e.target instanceof SVGElement) return;\n    hideTip();\n    document.querySelectorAll('.chart rect.band').forEach((b) => b.setAttribute('visibility', 'hidden'));\n  });\n\n  // ---- sterowanie ----\n  function drawAll() { if (CUR) { draw1(CUR); draw2(CUR); draw3(CUR); } }\n  function renderPeriod() {\n    CUR = period ? S.days.filter((x) => x.d >= addDays(S.today, -(period - 1))) : S.days;\n    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === period)));\n    drawAll();\n    renderModelTable(CUR);\n    renderSrcNote(CUR);\n    renderDays(CUR);\n  }\n  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {\n    period = +b.dataset.n;\n    try { localStorage.setItem(PKEY, String(period)); } catch (e) { /* brak pamięci przeglądarki */ }\n    if (S) renderPeriod();\n  }));\n  let rq = 0, lastW = 0;\n  new ResizeObserver((ents) => {\n    const w = Math.round(ents[0].contentRect.width);\n    if (w === lastW) return;\n    lastW = w;\n    cancelAnimationFrame(rq);\n    rq = requestAnimationFrame(drawAll);\n  }).observe(document.querySelector('.wrap'));\n\n  function fail(text) { const m = $('msg'); m.textContent = text; m.hidden = false; }\n  function render(doc) {\n    const s = prep(doc);\n    if (!s) return fail('Dokument danych nie ma jeszcze żadnego dnia.');\n    S = s;\n    MA = movingAvg();\n    $('msg').hidden = true;\n    $('main').hidden = false;\n    renderHead();\n    renderKpis();\n    renderPeriod();\n  }\n\n  async function boot() {\n    const c = window.claude;\n    if (!c || typeof c.use !== 'function') return <script type="application/json" id="strona-mapa">"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003cscript>\n/* Preludium pulpitu CLAS-5 (tools/pulpit_clas5.py): pierwszy skrypt dokumentu zakładki. */\n(function () {\n  'use strict';\n  var w = window, d = document, p = null;\n  try { if (w.parent && w.parent !== w) p = w.parent; } catch (e) { p = null; }\n  if (!p) return;\n  // (a) Runtime platformy: ta sama przestrzeń nazw co u rodzica, bez opakowania. Funkcje zostają\n  //     w realmie rodzica, więc odczyty bazy strony idą przez stronę-rodzica.\n  try { if (!w.claude && p.claude) w.claude = p.claude; } catch (e) { /* brak dostępu do rodzica */ }\n  // (b) Motyw: data-theme z \u003chtml> rodzica (brak u rodzica = brak tutaj).\n  try {\n    var t = p.document.documentElement.getAttribute('data-theme');\n    if (t === null) d.documentElement.removeAttribute('data-theme');\n    else d.documentElement.setAttribute('data-theme', t);\n  } catch (e) { /* zostaje motyw systemowy */ }\n  // (c) Linki. Zewnętrzny: nowa karta przez tymczasowy link w dokumencie rodzica (tam działa obsługa\n  //     linków przeglądarki artefaktu), awaryjnie window.open. Kotwica „#…”: przewinięcie tutaj.\n  function otworz(url) {\n    try {\n      var pd = p.document, a = pd.createElement('a');\n      a.href = url; a.target = '_blank'; a.rel = 'noopener';\n      (pd.body || pd.documentElement).appendChild(a);\n      a.click();\n      a.parentNode.removeChild(a);\n      return;\n    } catch (e) { /* awaryjnie niżej */ }\n    try { w.open(url, '_blank', 'noopener'); } catch (e) { /* nic więcej się nie da */ }\n  }\n  function kotwica(frag) {\n    var id = frag, el = null;\n    try { id = decodeURIComponent(frag); } catch (e) { id = frag; }\n    if (id) el = d.getElementById(id) || d.getElementsByName(id)[0] || null;\n    if (!el) { if (!id || id.toLowerCase() === 'top') w.scrollTo(0, 0); return; }\n    var m = parseFloat(w.getComputedStyle(el).scrollMarginTop) || 0;\n    w.scrollTo(0, el.getBoundingClientRect().top + w.pageYOffset - m);\n  }\n  try {\n    d.addEventListener('click', function (e) {\n      try {\n        if (e.defaultPrevented || e.button !== 0) return;\n        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n        if (!a || a.hasAttribute('download')) return;\n        var href = a.getAttribute('href') || '';\n        if (href.charAt(0) === '#') { e.preventDefault(); kotwica(href.slice(1)); return; }\n        var url = new URL(href, d.baseURI).href;\n        if (/^javascript:/i.test(url)) return;\n        e.preventDefault();\n        otworz(url);\n      } catch (err) { /* zostaje zwykłe zachowanie linku */ }\n    }, true);\n  } catch (e) { /* bez przechwytywania linków */ }\n})();\n\u003c/script>\u003c/head>\u003cbody>\n\u003ctitle>Mapa CLAS-5\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n\u003c!-- Źródło strony „Mapa CLAS-5” — zakładka „Mapa” strony „Pulpit CLAS-5” (adres w README.md). Mapa jest\n     WIDOKIEM: przy sprzeczności wygrywają runs/INDEX.md, STATUS.md, docs/rag/09 i dziennik/README.md.\n     Aktualizacja = edycja tego pliku, python3 tools/pulpit_clas5.py i publikacja tools/pulpit_clas5.html pod\n     adres pulpitu. Styl: szwajcarska siatka użytkownika. -->\n\u003cstyle>\n:root{\n  --bg:#FFFFFF; --ink:#141414; --muted:#6A6A66; --hair:#E4E4E0;\n  --accent:#C41E24; --s2:#
