s=\"lf\" x=\"668\" y=\"112.0\" text-anchor=\"start\">kierunek BTC z wykresu: brak przewagi (≈ 50 %)\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"129.0\" text-anchor=\"start\">analiza techniczna: 7 rodzin zamkniętych\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"146.0\" text-anchor=\"start\">dane spoza wykresu: tracą po kosztach\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"163.0\" text-anchor=\"start\">ślady: premia Coinbase, trend tygodniowy\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"180.0\" text-anchor=\"start\">carry z hedgem działa, ale to nie cel\u003c/text>\n\u003cpath class=\"br hot\" d=\"M578,259.5 C619.0,259.5 619.0,216.0 660,216.0\">\u003c/path>\n\u003ccircle class=\"dot hot\" cx=\"660\" cy=\"216.0\" r=\"4\">\u003c/circle>\n\u003ctext class=\"bh\" x=\"668\" y=\"221.0\" text-anchor=\"start\">Dziennik papierowy\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"241.0\" text-anchor=\"start\">trend tygodniowy 2× + premia Coinbase 3×\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"258.0\" text-anchor=\"start\">wynik liczony od 24.09.2026, kapitał 1\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"275.0\" text-anchor=\"start\">ostrzeżenie przy −18,4 %, STOP przy −27,6 %\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"292.0\" text-anchor=\"start\">odczyty: 24.12.2026, 24.03.2027, 23.09.2027\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"309.0\" text-anchor=\"start\">momentum X1 osobno, tylko zapis\u003c/text>\n\u003cpath class=\"br\" d=\"M578,259.5 C619.0,259.5 619.0,345.0 660,345.0\">\u003c/path>\n\u003ccircle class=\"dot\" cx=\"660\" cy=\"345.0\" r=\"4\">\u003c/circle>\n\u003ctext class=\"bh\" x=\"668\" y=\"350.0\" text-anchor=\"start\">Infrastruktura\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"370.0\" text-anchor=\"start\">serwer Linux w Polsce: badania, dziennik, kolektory\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"387.0\" text-anchor=\"start\">komputer z Windows: zapas dziennika, sam się wyłącza\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"404.0\" text-anchor=\"start\">Cowork: rutyny stron dziennika (06:30) i tokenów (05:00)\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"421.0\" text-anchor=\"start\">GitHub: publiczne repo, master zasila dziennik\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"438.0\" text-anchor=\"start\">strony: Dziennik CLAS-5, Tokeny CLAS-5, ta mapa\u003c/text>\n\u003ctext class=\"lf\" x=\"668\" y=\"455.0\" text-anchor=\"start\">monitor tokenów, agent lokalizator (Haiku)\u003c/text>\n\u003crect class=\"box core\" x=\"462\" y=\"232.5\" width=\"116\" height=\"54\">\u003c/rect>\n\u003ctext class=\"ct\" x=\"520\" y=\"260.5\" text-anchor=\"middle\">CLAS-5\u003c/text>\n\u003ctext class=\"s\" x=\"520\" y=\"277.5\" text-anchor=\"middle\">perpetuale Binance\u003c/text>\n\u003c/svg>\u003c/div>\n  \u003cfigcaption>Po lewej to, co projekt przyjmuje z góry: cel, dane, przyrząd i sposób pracy. Po prawej to, co z tego wynika:\n    wiedza, dziennik papierowy i maszyny, które go liczą. Czerwona gałąź to miejsce, w którym projekt jest teraz.\u003c/figcaption>\n\u003c/figure>\n\n\u003ch2 id=\"wiedza\">Stan wiedzy\u003c/h2>\n\u003ch3>Co już wiemy, od dowodu braku do tego, co działa\u003c/h3>\n\u003cp>Kolumny idą od najmocniej zamkniętych kierunków do działających. Pod każdą pozycją są nazwy rund i numery wniosków\n  z \u003cspan style=\"font-family:var(--mono)\">runs/INDEX.md\u003c/span>, gdzie stoją pełne liczby.\u003c/p>\n\u003cdiv class=\"board\">\u003csection class=\"col\" aria-label=\"Dowód braku\">\u003cdiv class=\"ch\">\u003cspan class=\"st no\">\u003ci>\u003c/i>Dowód braku\u003c/span>\u003cspan class=\"cnt\">6\u003c/span>\u003c/div>\u003cp class=\"cn\">zamknięte; nie wracać bez nowej informacji\u003c/p>\u003carticle class=\"k\">\u003ch4>Kierunek BTC z wykresu\u003c/h4>\u003cp>Świece 5m, 1h i 4h: trafność ≈ 50 % na dużych próbach. Faza 0: 50,27 % przy n = 7 687.\u003c/p>\u003cdiv class=\"ids\">Z10, M1, Y1, WF1 · wn. 12, 39, 69, 85\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Analiza techniczna\u003c/h4>\u003cp>7 rodzin na BTC 4h, formacje świecowe 46,4 %. MACD i EMA na 1h niemierzalne.\u003c/p>\u003cdiv class=\"ids\">A1, A2 · wn. 48–53, 103, 104\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Wykonanie i prowadzenie pozycji\u003c/h4>\u003cp>Zlecenie po cenie, połowa zysku wcześniej, stop na wejście: pieniądze bez zmian.\u003c/p>\u003cdiv class=\"ids\">W1, N1 · wn. 42–45\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Dane spoza wykresu na BTC 4h\u003c/h4>\u003cp>Funding, pozycjonowanie, opcje, on-chain, Fear &amp; Greed. Ślad +0,02…+0,05 % na transakcję przy koszcie 0,08 %.\u003c/p>\u003cdiv class=\"ids\">SW, O1, L1, V1, G1 · wn. 90\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Przepływy bez prognozy\u003c/h4>\u003cp>Przełączanie carry po znaku fundingu, premia rebalansowa (−3,6 %/rok), short nowych listingów.\u003c/p>\u003cdiv class=\"ids\">C1, R1, NL1 · wn. 55, 57, 71\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Tłok lewara\u003c/h4>\u003cp>Short monet, na których lewar goni ruch: −10,5 %/rok. Filtr tłoku nie pomaga trendowi.\u003c/p>\u003cdiv class=\"ids\">TL1, TF1\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"col\" aria-label=\"Niemierzalne\">\u003cdiv class=\"ch\">\u003cspan class=\"st nm\">\u003ci>\u003c/i>Niemierzalne\u003c/span>\u003cspan class=\"cnt\">5\u003c/span>\u003c/div>\u003cp class=\"cn\">szum większy niż spodziewany efekt; test nie startuje\u003c/p>\u003carticle class=\"k\">\u003ch4>Carry przekrojowy\u003c/h4>\u003cp>Short tam, gdzie funding najwyższy, long tam, gdzie najniższy.\u003c/p>\u003cdiv class=\"ids\">P2 · wn. 40\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Pozycja według siły sygnału\u003c/h4>\u003cp>Szum ±13–17 %/rok przy efekcie kilku %/rok.\u003c/p>\u003cdiv class=\"ids\">SC1 · wn. 78\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Premia koreańska\u003c/h4>\u003cp>Efekt z badań ok. SR 0,15 wobec progu 0,86.\u003c/p>\u003cdiv class=\"ids\">KP1 · wn. 91\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Stablecoiny, ETF i reszta sondy\u003c/h4>\u003cp>15 hipotez: na 5 latach szum 2–5× większy niż efekt.\u003c/p>\u003cdiv class=\"ids\">SH1 · wn. 81\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>ML przekrojowe top-50\u003c/h4>\u003cp>Przekrój widzi IC ≈ 0,022, ale ML z przeszukiwaniem traci ~2/3 mocy.\u003c/p>\u003cdiv class=\"ids\">AU2 · wn. 92, 93\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"col\" aria-label=\"Ślad, nie dowód\">\u003cdiv class=\"ch\">\u003cspan class=\"st tr\">\u003ci>\u003c/i>Ślad, nie dowód\u003c/span>\u003cspan class=\"cnt\">4\u003c/span>\u003c/div>\u003cp class=\"cn\">każdy wybrany spośród ~30 odczytów tej samej historii\u003c/p>\u003carticle class=\"k\">\u003ch4>Premia Coinbase → BTC na tydzień\u003c/h4>\u003cp>+32 %/rok, t 2,09. Po korekcie na ~28 prób DSR 0,52. Poza próbą (lip–wrz 2026) +0,1 %.\u003c/p>\u003cdiv class=\"ids\">CP1, CP1P, AU4 · wn. 72, 96\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Trend tygodniowy top-20\u003c/h4>\u003cp>Po korekcie danych ~+11 %/rok [−4; +26], nieistotny.\u003c/p>\u003cdiv class=\"ids\">TS1, RU1 · wn. 70, 74, 82\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Trend na miejscach 21–50\u003c/h4>\u003cp>+15,5 %/rok, t 1,99, ale znany z góry. Od 2022 t 1,32.\u003c/p>\u003cdiv class=\"ids\">TR1, RU3 · wn. 88\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Momentum przekrojowe top-20\u003c/h4>\u003cp>Średnia z 7 dni startu tygodnia +9,5 %/rok, t 0,61. Dawne +42 % to najlepszy dzień.\u003c/p>\u003cdiv class=\"ids\">X1, X1F · wn. 89\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"col\" aria-label=\"Mierzone na żywo\">\u003cdiv class=\"ch\">\u003cspan class=\"st live\">\u003ci>\u003c/i>Mierzone na żywo\u003c/span>\u003cspan class=\"cnt\">3\u003c/span>\u003c/div>\u003cp class=\"cn\">rozstrzyga czas, nie kolejny odczyt historii\u003c/p>\u003carticle class=\"k\">\u003ch4>Trend 2× + premia Coinbase 3×\u003c/h4>\u003cp>Dziennik od 24.09.2026. Na historii ~+17 %/rok, największy spadek ~18 %. Pierwszy odczyt 24.12.2026.\u003c/p>\u003cdiv class=\"ids\">SZ1, RU1 · wn. 77, 82, 107\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Momentum X1 osobno\u003c/h4>\u003cp>Tylko zapis w dzienniku, od 25.09.2026.\u003c/p>\u003cdiv class=\"ids\">X1F · wn. 89\u003c/div>\u003c/article>\u003carticle class=\"k\">\u003ch4>Likwidacje\u003c/h4>\u003cp>Binance od 25.09, pełne z Bybit od 27.09.2026. Odczyt E1 po ≥ 1 roku.\u003c/p>\u003cdiv class=\"ids\">LK0, LB0 · wn. 102, 106\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"col\" aria-label=\"Działa, ale nie cel\">\u003cdiv class=\"ch\">\u003cspan class=\"st ok\">\u003ci>\u003c/i>Działa, ale nie cel\u003c/span>\u003cspan class=\"cnt\">1\u003c/span>\u003c/div>\u003cp class=\"cn\">przepływ za dźwignię, nie prognoza\u003c/p>\u003carticle class=\"k\">\u003ch4>Carry z hedgem, wersja COIN-M\u003c/h4>\u003cp>~+9 %/rok, bez likwidacji z konstrukcji. Cel użytkownika to zwroty rzędu zakładu o kierunek.\u003c/p>\u003cdiv class=\"ids\">C1, D1 · wn. 61\u003c/div>\u003c/article>\u003c/section>\u003c/div>\n\u003ch2>Przyrząd\u003c/h2>\n\u003ch3>Dlaczego ufamy tym liczbom\u003c/h3>\n\u003cdiv class=\"trust\">\u003cdiv class=\"tr\">\u003ch4>Moc testu\u003c/h4>\u003cp>Prawdziwe +10 %/rok test wykrywa w ~25 % przypadków, +20 %/rok w ~73 %. „Nierozstrzygnięty” znaczy więc zwykle „za mało lat”.\u003c/p>\u003cdiv class=\"ids\">AU1 · wn. 87\u003c/div>\u003c/div>\u003cdiv class=\"tr\">\u003ch4>Kontrole przyrządu\u003c/h4>\u003cp>K1: przyrząd widzi znany sygnał. NC1: silniki nie wymyślają zysku z szumu o grubych ogonach.\u003c/p>\u003cdiv class=\"ids\">K1, NC1 · wn. 79\u003c/div>\u003c/div>\u003cdiv class=\"tr\">\u003ch4>Dwa warunki werdyktu\u003c/h4>\u003cp>Zwrot netto t_neff &gt; 1,96 i, przy regułach z trafnością, dolny kraniec trafności nad progiem.\u003c/p>\u003cdiv class=\"ids\">wn. 43, 50\u003c/div>\u003c/div>\u003cdiv class=\"tr\">\u003ch4>Audyt po naprawie\u003c/h4>\u003cp>59 przebiegów przeliczonych po naprawie N_eff: żaden werdykt się nie zmienił.\u003c/p>\u003cdiv class=\"ids\">AU3 · wn. 94\u003c/div>\u003c/div>\u003c/div>\n\n\u003cfooter>\n  \u003cp>Źródła: runs/INDEX.md (skrót stanu wiedzy, wnioski do 107), README.md (kamienie milowe), STATUS.md (ETAP 5–6),\n    docs/rag/09 (drabina dowodów), dziennik/README.md, crontab serwera.\u003c/p>\n  \u003cp>Mapa jest widokiem. Przy sprzeczności wygrywają te pliki. Aktualizacja: docs/mapa_projektu.html i ponowna publikacja.\u003c/p>\n\u003c/footer>\n\u003c/div>\n\n\u003c/body>\u003c/html>\n"</script>
<script type="application/json" id="strona-radar">"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003cscript>\n/* Preludium pulpitu CLAS-5 (tools/pulpit_clas5.py): pierwszy skrypt dokumentu zakładki. */\n(function () {\n  'use strict';\n  var w = window, d = document, p = null;\n  try { if (w.parent && w.parent !== w) p = w.parent; } catch (e) { p = null; }\n  if (!p) return;\n  // (a) Runtime platformy: ta sama przestrzeń nazw co u rodzica, bez opakowania. Funkcje zostają\n  //     w realmie rodzica, więc odczyty bazy strony idą przez stronę-rodzica.\n  try { if (!w.claude && p.claude) w.claude = p.claude; } catch (e) { /* brak dostępu do rodzica */ }\n  // (b) Motyw: data-theme z \u003chtml> rodzica (brak u rodzica = brak tutaj).\n  try {\n    var t = p.document.documentElement.getAttribute('data-theme');\n    if (t === null) d.documentElement.removeAttribute('data-theme');\n    else d.documentElement.setAttribute('data-theme', t);\n  } catch (e) { /* zostaje motyw systemowy */ }\n  // (c) Linki. Zewnętrzny: nowa karta przez tymczasowy link w dokumencie rodzica (tam działa obsługa\n  //     linków przeglądarki artefaktu), awaryjnie window.open. Kotwica „#…”: przewinięcie tutaj.\n  function otworz(url) {\n    try {\n      var pd = p.document, a = pd.createElement('a');\n      a.href = url; a.target = '_blank'; a.rel = 'noopener';\n      (pd.body || pd.documentElement).appendChild(a);\n      a.click();\n      a.parentNode.removeChild(a);\n      return;\n    } catch (e) { /* awaryjnie niżej */ }\n    try { w.open(url, '_blank', 'noopener'); } catch (e) { /* nic więcej się nie da */ }\n  }\n  function kotwica(frag) {\n    var id = frag, el = null;\n    try { id = decodeURIComponent(frag); } catch (e) { id = frag; }\n    if (id) el = d.getElementById(id) || d.getElementsByName(id)[0] || null;\n    if (!el) { if (!id || id.toLowerCase() === 'top') w.scrollTo(0, 0); return; }\n    var m = parseFloat(w.getComputedStyle(el).scrollMarginTop) || 0;\n    w.scrollTo(0, el.getBoundingClientRect().top + w.pageYOffset - m);\n  }\n  try {\n    d.addEventListener('click', function (e) {\n      try {\n        if (e.defaultPrevented || e.button !== 0) return;\n        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;\n        if (!a || a.hasAttribute('download')) return;\n        var href = a.getAttribute('href') || '';\n        if (href.charAt(0) === '#') { e.preventDefault(); kotwica(href.slice(1)); return; }\n        var url = new URL(href, d.baseURI).href;\n        if (/^javascript:/i.test(url)) return;\n        e.preventDefault();\n        otworz(url);\n      } catch (err) { /* zostaje zwykłe zachowanie linku */ }\n    }, true);\n  } catch (e) { /* bez przechwytywania linków */ }\n})();\n\u003c/script>\u003c/head>\u003cbody>\n\u003ctitle>Radar makro\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n\u003c!-- Źródło strony „Radar makro” — zakładka „Radar” strony „Pulpit CLAS-5” (adres w README.md). Dane:\n     dokument bazy radar/stan, zapisywany codziennie przez zadanie zaplanowane „Radar” na koncie\n     użytkownika (wyszukiwanie w sieci → ArtifactData set; archiwum dni w prywatnym repo radar-makro).\n     Strona nie zawiera żadnych kwot użytkownika: repo alpha jest publiczne. Zmiana strony = edycja\n     tego pliku, python3 tools/pulpit_clas5.py i publikacja tools/pulpit_clas5.html pod adres pulpitu.\n     Styl: szwajcarska siatka użytkownika. -->\n\u003cstyle>\n:root{\n  --bg:#FFFFFF; --ink:#141414; --muted:#6A6A66; --hair:#E4E4E0;\n  --accent:#C41E24; --s2:#2E6DA8; --good:#2F7D4F; --bad:#C41E24;\n  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;\n  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#17181A; --ink:#ECECE8; --muted:#9A9A96; --hair:#2A2B2E;\n  --accent:#E4574D; --s2:#4E97DB; --good:#5CAF7F; --bad:#E4574D;\n  color-scheme:dark;}}\n:root[data-theme=\"dark\"]{\n  --bg:#17181A; --ink:#ECECE8; --muted:#9A9A96; --hair:#2A2B2E;\n  --accent:#E4574D; --s2:#4E97DB; --good:#5CAF7F; --bad:#E4574D;\n  color-scheme:dark;}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;padding-inline:20px;padding-block:0 56px;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans)}\n.wrap{max-width:1080px;margin:0 auto}\nheader{padding-top:40px}\nh1{margin:0;font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}\n.meta{margin-top:8px;font:400 12px/1.6 var(--mono);color:var(--muted)}\n.fresh{margin-top:10px;display:flex;align-items:center;gap:8px;font:500 12px/1.4 var(--mono)}\n.fresh i{flex:none;width:8px;height:8px;background:var(--good)}\n.fresh.stale{color:var(--bad)}\n.fresh.stale i{background:var(--bad)}\np{margin:0;max-width:65ch}\n.lede{margin-top:16px}\n.msg{margin-top:40px;padding-block:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}\n.lab{font:600 11px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\nh2.lab{margin:48px 0 14px;padding-top:16px;border-top:1px solid var(--hair)}\n.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px;margin-top:32px}\n.kpi{border-top:1px solid var(--hair);padding-top:12px;min-width:0}\n.kpi .v{font:600 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}\n.kpi .v.alarm{color:var(--bad)}\n.kpi .u{margin-top:6px;font-size:12px;color:var(--muted)}\n.kpi .d{margin-top:8px;font-size:12px;color:var(--muted)}\n.tw{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:13px}\nth{font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 16px 8px 0;border-bottom:1px solid var(--hair);white-space:nowrap}\ntd{padding:10px 16px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}\nth:last-child,td:last-child{padding-right:0}\ntd.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}\ntd small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5;max-width:60ch}\ntd.n small{font-family:var(--sans)}\ntd.thr{white-space:normal;min-width:110px;max-width:190px}\n.st{display:inline-flex;align-items:center;gap:7px;font:500 12px/1.4 var(--mono);white-space:nowrap}\n.st i{flex:none;width:8px;height:8px}\n.st.ok i{background:var(--good)}\n.st.watch i{border:1.5px solid var(--accent)}\n.st.alarm{color:var(--bad)}\n.st.alarm i{background:var(--accent)}\n.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}\n.news article{border-top:1px solid var(--hair);padding:14px 0 18px;min-width:0}\n.news .nm{font:400 11.5px/1.5 var(--mono);color:var(--muted)}\n.news h3{margin:6px 0 8px;font-weight:600;font-size:16px;line-height:1.3}\n.news p{margin:0 0 8px;font-size:13.5px}\n.news p.im{color:var(--muted)}\n.news a{font:400 12px var(--mono);color:var(--s2)}\n.note{margin-top:12px;font-size:12.5px;color:var(--muted)}\nfooter{margin-top:56px;padding-top:16px;border-top:1px solid var(--hair);font:400 11.5px/1.8 var(--mono);color:var(--muted)}\nfooter p{max-width:none}\na:focus-visible{outline:2px solid var(--s2);outline-offset:2px}\n@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.news{grid-template-columns:1fr}}\n@media (max-width:480px){h1{font-size:24px}.kpi .v{font-size:24px}.kpis{grid-template-columns:1fr}}\n\u003c/style>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003ch1>Radar makro\u003c/h1>\n    \u003cdiv class=\"meta\" id=\"meta\">4 sygnały ostrzegawcze · 5 wskaźników tła · wiadomości ze świata\u003c/div>\n    \u003cdiv class=\"fresh\" id=\"fresh\" hidden>\u003ci>\u003c/i>\u003cspan>\u003c/span>\u003c/div>\n    \u003cp class=\"lede\">Cztery sygnały, które przybliżyłyby obecny obraz rynku do roku 2008. Alarm oznacza dwa\n      sygnały naraz. To lista kontrolna, nie prognoza: krzywa rentowności ostrzegała też w latach 2022–2024,\n      a recesja nie przyszła.\u003c/p>\n  \u003c/header>\n\n  \u003cp class=\"msg\" id=\"msg\">Wczytuję dane z bazy strony…\u003c/p>\n\n  \u003cmain id=\"main\" hidden>\n    \u003csection class=\"kpis\" id=\"kpis\" aria-label=\"Najważniejsze liczby\">\u003c/section>\n\n    \u003ch2 class=\"lab\">Sygnały ostrzegawcze\u003c/h2>\n    \u003cdiv class=\"tw\">\u003ctable id=\"t-sig\">\u003c/table>\u003c/div>\n    \u003cp class=\"note\">„Do obserwacji” = wartość przekroczyła 80% drogi do progu alarmu (dla ropy: powyżej 95 USD).\u003c/p>\n\n    \u003ch2 class=\"lab\">Najważniejsze wiadomości\u003c/h2>\n    \u003cdiv class=\"news\" id=\"news\">\u003c/div>\n  \u003c/main>\n\n  \u003cfooter>\n    \u003cp>Odświeżanie: codziennie rano zadanie zaplanowane „Radar” szuka w sieci najnowszych odczytów\n      (FRED, BLS, CME FedWatch, NBP, notowania) i zapisuje je do bazy tej strony. Każdy dzień trafia też\n      do prywatnego archiwum radar-makro (sygnały i wiadomości w CSV).\u003c/p>\n    \u003cp>Progi alarmu: spread high yield powyżej 4,0 pp · krzywa 10l–2l rośnie o 0,5 pp w 3 miesiące przy\n      spadających 2-latkach · bezrobocie w USA co najmniej 4,6% · Brent powyżej 120 USD.\u003c/p>\n    \u003cp>Analiza informacyjna — nie jest poradą licencjonowanego doradcy inwestycyjnego.\u003c/p>\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  'use strict';\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const ST = { ok: 'w normie', watch: 'do obserwacji', alarm: 'alarm' };\n  const st = (s) => (ST[s] ? s : 'watch');\n  const badge = (s) => '\u003cspan class=\"st ' + st(s) + '\">\u003ci aria-hidden=\"true\">\u003c/i>' + ST[st(s)] + '\u003c/span>';\n  const safeUrl = (u) => (/^https:\\/\\//i.test(String(u || '')) ? String(u) : '');\n\n  // „06.10.2026, 06:48” (czas polski) → znacznik czasu; null, gdy format nieznany.\n  function parseUpd(s) {\n    const m = /^(\\d{2})\\.(\\d{2})\\.(\\d{4})(?:,\\s*(\\d{1,2}):(\\d{2}))?/.exec(String(s || ''));\n    if (!m) return null;\n    return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();\n  }\n\n  function renderHead(doc) {\n    const t = parseUpd(doc.updated);\n    const el = $('fresh');\n    el.hidden = false;\n    const ageH = t ? (Date.now() - t) / 3.6e6 : Infinity;\n    el.classList.toggle('stale', ageH > 36);\n    el.querySelector('span').textContent = ageH > 36\n      ? 'Dane nieaktualne: ostatnie odświeżenie ' + (doc.updated || 'nieznane') + '. Sprawdź zadanie zaplanowane „Radar”.'\n      : 'Odświeżono ' + doc.updated + '. Następne: ' + (doc.next || 'codziennie rano') + '.';\n  }\n\n  function renderKpis(doc) {\n    const sig = doc.signals, ctx = doc.context;\n    const hit = sig.filter((x) => x.status === 'alarm').length;\n    const watch = sig.filter((x) => x.status === 'watch').length;\n    const k = ['\u003cdiv class=\"kpi\">\u003cdiv class=\"v' + (hit >= 2 ? ' alarm' : '') + '\">' + hit + ' z ' + sig.length + '\u003c/div>' +\n      '\u003cdiv class=\"u\">sygnałów przekroczonych · alarm od 2\u003c/div>\u003cdiv class=\"d\">' +\n      (hit >= 2 ? 'ALARM: dwa lub więcej sygnałów naraz.' : watch + ' do obserwacji, ' + (sig.length - hit - watch) + ' w normie.') + '\u003c/div>\u003c/div>'];\n    ctx.forEach((c) => {\n      k.push('\u003cdiv class=\"kpi\">\u003cdiv class=\"v\">' + esc(c.value) + '\u003c/div>\u003cdiv class=\"u\">' + esc(c.label) + '\u003c/div>\u003cdiv class=\"d\">' + esc(c.note) + '\u003c/div>\u003c/div>');\n    });\n    $('kpis').innerHTML = k.join('');\n  }\n\n  function renderSignals(doc) {\n    let h = '\u003cthead>\u003ctr>\u003cth>Sygnał\u003c/th>\u003cth class=\"n\">Dziś\u003c/th>\u003cth class=\"n\">Próg alarmu\u003c/th>\u003cth>Stan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    doc.signals.forEach((x) => {\n      h += '\u003ctr>\u003ctd>' + esc(x.name) + '\u003csmall>' + esc(x.sub) + '\u003c/small>\u003c/td>' +\n        '\u003ctd class=\"n\">' + esc(x.value) + '\u003csmall>' + esc(x.date) + '\u003c/small>\u003c/td>' +\n        '\u003ctd class=\"n thr\">' + esc(x.threshold) + '\u003c/td>' +\n        '\u003ctd>' + badge(x.status) + '\u003csmall>' + esc(x.note) + (x.source ? ' Źródło: ' + esc(x.source) + '.' : '') + '\u003c/small>\u003c/td>\u003c/tr>';\n    });\n    $('t-sig').innerHTML = h + '\u003c/tbody>';\n  }\n\n  function renderNews(doc) {\n    $('news').innerHTML = doc.news.map((n) => {\n      const u = safeUrl(n.url);\n      return '\u003carticle>\u003cdiv class=\"nm\">' + esc(n.date) + ' · ' + esc(n.region) + '\u003c/div>\u003ch3>' + esc(n.title) + '\u003c/h3>' +\n        '\u003cp>' + esc(n.summary) + '\u003c/p>\u003cp class=\"im\">\u003cstrong>Dla portfela:\u003c/strong> ' + esc(n.impact) + '\u003c/p>' +\n        (u ? '\u003ca href=\"' + esc(u) + '\" target=\"_blank\" rel=\"noopener\">' + esc(n.source || 'źródło') + ' ↗\u003c/a>' : '\u003cspan class=\"nm\">' + esc(n.source) + '\u003c/span>') +\n        '\u003c/article>';\n    }).join('') || '\u003cp>Brak wiadomości w tym odczycie.\u003c/p>';\n  }\n\n  function fail(text) { const m = $('msg'); m.textContent = text; m.hidden = false; $('main').hidden = true; }\n  function render(doc) {\n    if (!Array.isArray(doc.signals) || !Array.isArray(doc.context) || !Array.isArray(doc.news)) return fail('Dokument danych jest niekompletny.');\n    $('msg').hidden = true;\n    $('main').hidden = false;\n    renderHead(doc);\n    renderKpis(doc);\n    renderSignals(doc);\n    renderNews(doc);\n  }\n\n  async function boot() {\n    const c = window.claude;\n    if (!c || typeof c.use !== 'function') return fail('Ta strona czyta dane z bazy artefaktu. Otwórz ją na claude.ai.');\n    let db = null;\n    try { db = await c.use('db'); } catch (e) { db = null; }\n    if (!db) return fail('Baza strony jest niedostępna w tym widoku. Otwórz stronę na claude.ai, na koncie właściciela.');\n    db.doc('radar/stan').onSnapshot((snap) => {\n      if (!snap.exists) return fail('Brak danych. Pierwsze odświeżenie jeszcze się nie odbyło.');\n      const doc = snap.data();\n      if (!doc || doc.wersja !== 1) return fail('Nieznany format danych (wersja ' + String(doc && doc.wersja) + ').');\n      render(doc);\n    }, (err) => fail('Nie udało się odczytać bazy strony (' + String((err && err.code) || 'błąd') + '). Odśwież stronę.'));\n  }\n  boot();\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>\n"</script>
