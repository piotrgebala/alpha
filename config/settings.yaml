# config/settings.yaml
# Faza 0 — walidacja WYŁĄCZNIE na primary_symbol (BTC). Lista `symbols` przygotowuje grunt pod
# Fazę 1 (test generalizacji na ETH/SOL/BNB), nie oznacza równoległej walidacji teraz.

data:
  exchange_id: "binanceusdm"        # Binance USDS-M Futures = perpetuals, nie spot
  symbols:                          # ZWERYFIKUJ każdy przez exchange.load_markets() przed uruchomieniem
    - "BTC/USDT:USDT"               # Faza 0: waliduj TYLKO ten, reszta czeka na wynik Commitu 6
    - "ETH/USDT:USDT"                # Faza 1+: test generalizacji hipotezy z BTC, bez retuningu progów
    - "SOL/USDT:USDT"
    - "BNB/USDT:USDT"
  primary_symbol: "BTC/USDT:USDT"   # jedyny używany do Commit 1-6; reszta niezaangażowana do dalszej decyzji
  timeframe: "5m"                   # interwał PODSTAWOWY pipeline'u (walk-forward, cechy, target)
  # Z9 (2026-09-22): komplet interwałów pobieranych przez `py -m data.fetch_ohlcv`.
  # Cache w `cache_dir` jest trwały i kluczowany po (symbol, timeframe, start, end), więc
  # każdy interwał ściągany jest RAZ — `data/raw/` to jedno miejsce na wszystkie dane.
  # 1h/4h służą walidacji, czy agregacja z 5m (C2.6) nie zniekształca wyniku.
  timeframes: ["5m", "1h", "4h"]
  # Z5b (2026-09-22): 4h dostaje PEŁNĄ dostępną historię (pierwsza świeca BTC perp na
  # Binance USDS-M to 2019-09-08; 2019-09-10 omija dni z cenami placeholderowymi).
  # Powód jest konkretny, nie "więcej danych = lepiej": Z19 pokazał, że na 4h wiążącym
  # ograniczeniem jest LICZEBNOŚĆ PRÓBY (1 551 świec `range` wobec wymaganych 2 608),
  # a 4h ma najniższy próg opłacalności w projekcie (52,74%). Pliki cache są kluczowane
  # zakresem, więc krótki i długi wariant 4h współistnieją.
  timeframe_start_overrides:
    "4h": "2019-09-10T00:00:00Z"
  # Commit 2.10 (Backlog Z5): 3 lata historii. Poprzednie okno 2025-07-01→2026-07-01 to
  # zamrożone źródło wyników C6–C2.9 (runs/); jego parquet ZOSTAJE w data/raw nietknięty
  # (nazwa pliku koduje zakres, więc nowy zakres = nowy plik, bez nadpisywania).
  start: "2023-07-01T00:00:00Z"
  end: "2026-07-01T00:00:00Z"
  cache_dir: "data/raw"

features:
  candles_per_day: 288              # 24h * 60min / 5min — zmień, jeśli timeframe inny
  regime_window_days: 20

regime_rule:
  trend_threshold: 0.7
  range_threshold: 0.3

# Commit 4 (agents/labeling.py). UWAGA (2026-09-22): źródłem prawdy dla mnożnika ATR jest
# stała `ATR_MULTIPLIER` w agents/labeling.py, importowana przez risk_controller.py — kod NIE
# czyta tej wartości z configu. Zostaje jako dokumentacja; zgodność ze stałą pilnuje
# tests/test_atr_consistency.py (CLAUDE.md zasada 3, docs/rag/03).
# Wartości startowe, do kalibracji WYŁĄCZNIE wewnątrz walk-forward (CLAUDE.md zasada 1).
labeling:
  atr_multiplier: 1.5               # upper/lower barrier = entry ± atr_multiplier * atr_14
  vertical_barrier_candles: 12      # 1h @ timeframe 5m — timeout triple-barrier

walk_forward:
  train_window_days: 60             # ~2 miesiące
  test_window_days: 14              # 2 tygodnie
  step_days: 14                     # przesunięcie co 2 tygodnie

# Commit 5 (agents/ml_optimizer.py). Hiperparametry startowe dla OBU modeli (model_momentum,
# model_reversion) — identyczne na tym etapie (docs/rag/03). Kalibracja WYŁĄCZNIE wewnątrz
# walk-forward (CLAUDE.md zasada 1), nigdy na całym zbiorze naraz.
model:
  max_depth: 4
  learning_rate: 0.05               # native XGBoost API nazywa to "eta"
  n_estimators: 200                 # native API: num_boost_round
  # Z17+Z21 (2026-09-22): early stopping liczy się na CHRONOLOGICZNYM OGONIE foldu
  # TRENINGOWEGO (validation_fraction=0.2), nie na foldzie OOS. Poprzedni komentarz
  # brzmiał "na foldzie OOS (test), nigdy na train" — opisywał BUGA jako decyzję
  # projektową. Dodatkowo embargo=vertical_barrier_candles odcina ogon treningu,
  # którego etykiety sięgały w okno testowe.
  early_stopping_rounds: 20
  validation_fraction: 0.2          # ułamek foldu treningowego na walidację early stoppingu
  seed: 42                          # jawny i logowany — docs/rag/05 (reprodukowalność)

# Commit 5 (backtest/costs.py). Wartości startowe kosztów transakcyjnych Binance USDS-M Futures —
# do kalibracji, gdy dostępne będą realne dane funding rate (Faza 1, LEAN BinanceFundingRate,
# docs/rag/04).
costs:
  taker_fee_rate: 0.0005            # 0.05% za stronę (Binance USDS-M Futures, VIP0 taker)
  # Commit 2.12 (Backlog Z6) — model wykonania "maker_limit": wejście i take-profit jako
  # zlecenia limit (maker), stop-loss i timeout jako market (taker; SL musi być market,
  # inaczej nie ma gwarancji wyjścia). Slippage naliczany TYLKO na nogach taker.
  # ZAŁOŻENIE JAWNE: noga maker zakłada, że limit się wypełnia — model pomija adverse
  # selection (limit wypełnia się częściej, gdy rynek idzie przeciw pozycji), więc realny
  # koszt maker jest wyższy niż modelowany. To ograniczenie modelu, nie wynik.
  #
  # H3 (2026-09-22) — noga TIMEOUT rozstrzygnięta na stałe. Kryterium: noga maker jest dobrze
  # zdefiniowana tylko wtedy, gdy CENA zlecenia jest znana przy składaniu. Przy timeoucie
  # znamy CZAS (świeca t+V), a NIE cenę — więc `taker` jest POPRAWNE, nie błędne. Wariant
  # `maker` istnieje wyłącznie jako drugi kraniec analizy wrażliwości (`timeout_leg`
  # w `run_backtest`), NIE jako opcja do włączenia: byłby niespójny z tym, jak silnik liczy
  # cenę wyjścia timeoutu (`close` tej świecy, nieosiągalny limitem bez lookaheadu).
  # Zmierzone pasmo progu opłacalności: [51,64%; 52,69%] — niepewność NIEISTOTNA decyzyjnie.
  # Wartości pośrednie (ciągła stopa wypełnienia) wymagają danych o fillach — bez nich nie
  # wchodzą do repo. Pełny ADR: docs/rag/04, runda: runs/2026-09-22_h3-noga-timeout-pasmo/.
  #
  # Świadomie BEZ klucza runtime dla `timeout_leg` — tak samo jak `execution_model`, który
  # też jest stałą modułową. Drugie źródło prawdy byłoby kolejnym miejscem na rozjazd.
  maker_fee_rate: 0.0002            # 0.02% za stronę (Binance USDS-M Futures, VIP0 maker)
  funding_rate_8h: 0.0001           # 0.01% / 8h — przybliżenie, brak jeszcze realnych danych funding
  slippage_bps: 2                   # 2 bps = 0.02%, stała wartość startowa

# Commit 5.5 (agents/risk_controller.py). Sizing + kill-switch — wartości startowe, do
# kalibracji WYŁĄCZNIE wewnątrz walk-forward (CLAUDE.md zasada 1). max_leverage jest twardym
# sufitem niezależnym od signal_confidence (CLAUDE.md zasada 5 — leverage cap zawsze wygrywa).
risk:
  risk_per_trade: 0.005             # 0.5% equity, fixed-fractional (NIE Kelly na tym etapie)
  max_leverage: 3.0                 # konserwatywnie, wartość startowa
  kill_switch_drawdown_pct: 0.15    # drawdown od peaku equity > 15% -> stop nowych sygnałów
  kill_switch_cooldown_days: 7      # Commit 2c: dni ciągłej suppresji przed reset peak_equity/re-arm
  # Commit 2d — bramka wykonalności kosztowej: sygnał wchodzi do sizingu tylko, gdy
  # (atr_multiplier * atr_14) / entry_price >= min_barrier_to_cost_ratio * koszt_round_trip.
  # Wartość startowa 2.0 wyprowadzona z arytmetyki break-even p = 0.5*(1 + 1/ratio):
  # ratio=1.0 -> 100% wymaganej trafności, 2.0 -> 75%, 3.0 -> 66.7%. NIE dobrana
  # przeszukiwaniem po Sharpe — do kalibracji WYŁĄCZNIE wewnątrz walk-forward
  # (CLAUDE.md zasada 1). Uzasadnienie empiryczne: backtest/diagnose_cost_feasibility.py.
  min_barrier_to_cost_ratio: 2.0

