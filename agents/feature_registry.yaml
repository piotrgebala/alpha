# feature_registry.yaml
#
# Manifest cech — źródło prawdy dla agents/feature_miner.py.
# Każdy wpis: wzór, biblioteka, okno, rola, grupa testowa, ryzyko leakage, data dodania.
#
# role:
#   base           - baza dla innych cech / risk_controller / triple-barrier labeling
#   regime_filter  - służy do klasyfikacji trend/range, NIE wchodzi do modelu jako feature
#   signal         - wchodzi jako feature do modelu (Test 1 i/lub Test 2)
#
# test_group:
#   shared - używana w obu testach
#   trend  - tylko Test 1 (momentum)
#   range  - tylko Test 2 (mean-reversion)

features:
  atr_14:
    formula: "Average True Range, Wilder smoothing, 14-period"
    library: "TA-Lib (ATR)"
    window: 14
    role: base
    test_group: shared
    leakage_risk: low
    added: "2026-07-05"

  atr_pctrank_20d:
    formula: "Rolling percentile rank atr_14 w trailing oknie ~20 dni (pandas Rolling.rank(pct=True))"
    library: "pandas"
    window: "20 dni = 5760 świec @ 5m"
    role: regime_filter
    test_group: shared
    leakage_risk: high
    leakage_note: "Musi być trailing (rank ostatniej wartości względem okna), nie centered. Pierwszy kandydat do test_leakage.py."
    added: "2026-07-05"

  direction_persistence_10:
    formula: "abs(sum(sign(return))) / 10 w trailing 10 świecach"
    library: "pandas / numpy"
    window: 10
    role: regime_filter
    test_group: shared
    leakage_risk: low
    added: "2026-07-05"

  return_lag_1:
    formula: "ln(close[t] / close[t-1])"
    library: "numpy"
    window: 1
    role: signal
    test_group: shared
    leakage_risk: low
    added: "2026-07-05"

  momentum_5:
    formula: "ln(close[t] / close[t-5])"
    library: "numpy"
    window: 5
    role: signal
    test_group: trend
    leakage_risk: low
    added: "2026-07-05"

  ema_diff_9_21:
    formula: "(EMA9 - EMA21) / close[t] — znormalizowane przez cenę"
    library: "TA-Lib (EMA)"
    window: "9, 21"
    role: signal
    test_group: trend
    leakage_risk: low
    added: "2026-07-05"

  volume_zscore_20:
    formula: "(volume[t] - mean20) / std20, rolling trailing"
    library: "pandas"
    window: 20
    role: signal
    test_group: shared
    leakage_risk: low
    added: "2026-07-05"

  rsi_14:
    formula: "RSI, Wilder smoothing, 14-period"
    library: "TA-Lib (RSI)"
    window: 14
    role: signal
    test_group: range
    leakage_risk: low
    added: "2026-07-05"

  price_zscore_20:
    formula: "(close[t] - mean20) / std20, rolling trailing"
    library: "pandas"
    window: 20
    role: signal
    test_group: range
    leakage_risk: low
    added: "2026-07-05"

  adx_14:
    formula: "Average Directional Index, Wilder smoothing, 14-period — siła trendu niezależna od kierunku"
    library: "TA-Lib (ADX)"
    window: 14
    role: signal
    test_group: trend
    leakage_risk: low
    added: "2026-09-21"
    note: >
      Promowana z screeningu korelacji (Commit 2.7, backtest/screen_feature_candidates.py) —
      jedyny z 8 kandydatów nisko skorelowany z resztą registry (corr=+0.07 z
      direction_persistence_10). Formalny test OOS jako DODATEK do MOMENTUM_FEATURES
      (agents/ml_optimizer.py), nie zamiennik żadnej istniejącej cechy: Commit 2.8,
      backtest/evaluate_feature_candidate.py, runs/2026-09-21_c2.8-adx14-oos-evaluation/README.md.
      Obliczana dla każdej świecy (FEATURE_FUNCTIONS) niezależnie od wyniku testu OOS —
      dodanie do MOMENTUM_FEATURES jest osobną decyzją, dopiero po przeczytaniu wyniku.

  cdl_score_6:
    formula: "sum_k sign(CDL_k(t)) dla k in (CDLENGULFING, CDLHAMMER, CDLSHOOTINGSTAR, CDLMORNINGSTAR, CDLEVENINGSTAR, CDLRISEFALL3METHODS); liczby całkowite w [-6, 6]"
    library: "TA-Lib (CDL*, 0.7.1)"
    window: "1-5 świec (lookback formacji), do 10 dla średniej długości korpusu wewnątrz TA-Lib"
    role: signal
    test_group: range
    leakage_risk: low
    added: "2026-09-23"
    note: >
      Runda A1 (runs/2026-09-23_a1-formacje-swiecowe/README.md): sześć formacji z podręcznika
      (skill ta-toolkit, materiał XTB), zestaw zapisany w pre-rejestracji PRZED spojrzeniem na
      dane; doji wyłączone (TA-Lib zwraca 100 = "formacja jest", bez kierunku). sign() zdejmuje
      wariant +-80 objęcia z TA-Lib 0.7.1 — siła formacji nie jest parametrem. Używana dwojako:
      A1a jako REGUŁA (kierunek = sign(score), bez modelu; backtest/checkpoint_lib.py::
      build_rule_signals) i A1b jako jedna dodatkowa cecha obok REVERSION_FEATURES
      (agents/ml_optimizer.py bez zmian — zestaw podawany przez regime_feature_sets, jak adx_14
      w C2.8). Obliczana dla każdej świecy (FEATURE_FUNCTIONS) niezależnie od wyniku rundy.

# Reguła regime gate — deterministyczna, nie model (decyzja: patrz rozmowa o HMM vs reguła)
regime_rule:
  trend_threshold: 0.7
  range_threshold: 0.3
  ambiguous_action: "wyklucz świecę z Testu 1 i Testu 2"
  calibration_status: "wartości startowe — kalibrowane w walk-forward (Commit 4), nie finalne"

# Cechy ZEWNETRZNE - nie liczone z OHLCV, wiec NIE w `features:` powyzej.
#
# `features:` ma kontrakt: compute_*(df: OHLCV) -> Series, pilnowany testem CI
# (agent_5_compliance/test_leakage.py::test_feature_functions_matches_registry).
# Funding przychodzi z gieldy i ma WLASNA siatke czasowa (co 8h), wiec tego kontraktu
# nie spelnia - zlaczenie robi agents/funding_features.py, nie feature_miner.
external_features:
  funding_rate:
    formula: "Ostatnia stawka funding rozliczona w momencie swiecy LUB WCZESNIEJ (merge_asof backward)"
    source: "Binance USDS-M Futures, data/fetch_funding.py (cache: data/raw/*_funding_*.parquet)"
    grid: "co 8h: 00:00 / 08:00 / 16:00 UTC"
    implementation: "agents/funding_features.py::attach_funding_rate"
    role: signal
    test_group: range
    leakage_risk: "SREDNIE - zlaczenie dwoch zrodel o roznych siatkach czasowych; przeciek
      oznaczalby przypisanie swiecy stawki rozliczonej PO niej. Trzy testy w
      agent_5_compliance/test_leakage.py: truncate-vs-extend, mutate-the-future oraz
      dowod wprost (kazda przypisana stawka pochodzi z rozliczenia <= znacznik swiecy)."
    added: "2026-09-22"
    round: "H2.1 - pierwsze w projekcie zrodlo informacji spoza OHLCV (uzasadnienie:
      runs/2026-09-22_z10-zamkniecie-fazy-0/ - waskie gardlo Fazy 0 bylo INFORMACYJNE)"
    raw_not_normalized: "SUROWA stawka, bez z-score. XGBoost jest drzewiasty, wiec
      niewrazliwy na monotoniczne przeskalowanie pojedynczej cechy; kazdy wybor okna
      normalizacji bylby wolnym parametrem bez mozliwosci kalibracji (pulapka unikniecia
      w H3). Masa punktowa 35,85% na stawce bazowej (H2.0) przestaje byc problemem, bo
      drzewo dzieli po wartosci, nie po percentylu."

# Cechy ANALIZY TECHNICZNEJ ze skilla `ta-toolkit` (runda A2, 2026-09-23) — agents/ta_rules.py.
# NIE wchodzą do `features:` (produkcyjny zestaw modelu zostaje nietknięty); kontrakt ten sam
# (compute_*(df: OHLCV) -> Series, trailing), test przecieku parametryzowany po
# TA_FEATURE_FUNCTIONS w agent_5_compliance/test_leakage.py, zgodność kluczy z tym plikiem
# pilnowana testem. Parametry = domyślne skilla (jeden zestaw; inny zestaw = osobny wariant).
# Reguły kierunkowe z tych cech (rule_*) i ich pre-rejestracja: runs/2026-09-23_a2-rodziny-at/.
ta_rules:
  trend_structure:
    formula: "+1 gdy dwa ostatnie POTWIERDZONE szczyty rosną i dołki rosną (HH+HL), -1 przy LH+LL, 0 inaczej; swing potwierdzony po confirm=5 barach"
    dof: "confirm"
    leakage_risk: "wysokie w wersji 'z wykresu' (ostatni szczyt widoczny z przyszłości); tu opóźnienie o confirm barów z konstrukcji"
    added: "2026-09-23"
  double_top_bottom:
    formula: "-1: dwa ostatnie potwierdzone szczyty w tolerancji 0,5*ATR z odbiciem >= 2*ATR między nimi; +1 symetrycznie na dołkach; STAN do następnego swingu"
    dof: "confirm, tol_atr=0.5, bounce_atr=2.0 (w ATR, nie w %)"
    leakage_risk: "jw. — potwierdzenie drugiego swingu"
    added: "2026-09-23"
  head_shoulders:
    formula: "-1: trzy ostatnie potwierdzone szczyty [S1,H,S2] z H >= S +/- 1*ATR i |S1-S2| <= 1*ATR; +1 odwrócona na dołkach; STAN"
    dof: "confirm, shoulder_tol_atr=1.0, head_min_atr=1.0"
    leakage_risk: "jw. — prawe ramię potwierdzone confirm barów po szczycie"
    added: "2026-09-23"
  ma_state:
    formula: "(EMA10 - EMA30) / close — ciągły stan"
    dof: "fast=10, slow=30 (bliski krewny ema_diff_9_21 z registry — inne okna, tu użyty tylko jako znak przy przecięciu)"
    leakage_risk: low
    added: "2026-09-23"
  ma_cross_age:
    formula: "liczba barów od ostatniej zmiany znaku (EMA10 - EMA30); 0 = świeże przecięcie"
    dof: "fast, slow"
    leakage_risk: low
    added: "2026-09-23"
  trendline_distance:
    formula: "regresja liniowa (czas, poziom) przez k=3 ostatnie potwierdzone dołki; (close - linia(t)) / close"
    dof: "confirm, k"
    leakage_risk: "jw. — dołki potwierdzone"
    added: "2026-09-23"
  fib_position:
    formula: "(close - start) / (end - start) ostatniego potwierdzonego impulsu (dołek->szczyt lub odwrotnie, co nowsze); 0,382/0,5/0,618 = zniesienia"
    dof: "confirm"
    leakage_risk: "jw. — oba końce impulsu potwierdzone"
    added: "2026-09-23"
  fib_impulse:
    formula: "kierunek ostatniego potwierdzonego impulsu: +1 wzrostowy, -1 spadkowy"
    dof: "confirm"
    leakage_risk: "jw."
    added: "2026-09-23"
  sr_distance:
    formula: "(close - najbliższy potwierdzony poziom z ostatnich 500 barów) / ATR ze znakiem (+ nad poziomem, - pod)"
    dof: "confirm, lookback=500"
    leakage_risk: "jw. — poziomy z potwierdzonych swingów"
    added: "2026-09-23"
  breakout:
    formula: "+1: close > max(high[t-20..t-1]); -1: close < min(low[t-20..t-1]); 0 inaczej"
    dof: "n=20"
    leakage_risk: "low (zakres liczony BEZ bieżącego bara)"
    added: "2026-09-23"

# --- O1 (2026-09-23): cechy z POZYCJONOWANIA (archiwum Binance metrics 5 min, P3) ---------------
# Osobna sekcja jak `ta_rules:` — cechy liczone w agents/positioning_features.py na świecach 4h
# z dopiętym snapshotem `oi_close` (ostatni odczyt WEWNĄTRZ świecy, bez lookaheadu; test w
# agent_5_compliance/test_leakage.py). Zgodność kodu z sekcją pilnowana testem. Jedna cecha na
# rundę (zasada 4); pre-rejestracja: runs/2026-09-23_o1-pozycjonowanie/.
positioning:
  oi_change_24h:
    formula: "log(oi_close_t / oi_close_{t-6}) na świecach 4h; oi_close = sum_open_interest (BTC, nie USD) z ostatniego odczytu 5-min wewnątrz świecy; OI <= 0 (błędy archiwum) = NaN"
    dof: "okno 6 świec (24h) — jedno, zapisane przed danymi"
    leakage_risk: "niskie: snapshot ściśle wewnątrz świecy (open, open+3h55m], funkcja trailing; ryzyko leży w dopięciu (odczyt po zamknięciu) — test attach + test shift-forward"
    added: "2026-09-23"
