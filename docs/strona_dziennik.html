.hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }

<script>
const HOSTS = { dantey1: "serwer", pitgeb: "Twój komputer" };
const hostName = h => h ? (HOSTS[h] || h) : "nieznana maszyna";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (x, d = 1) => x == null || Number.isNaN(x) ? "—" : x.toLocaleString("pl-PL", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 1, sign = false) => x == null ? "—" : (sign && x > 0 ? "+" : "") + nf(x * 100, d) + " %";
const MONTHS = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const longDate = iso => { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
const short = iso => { if (!iso) return "—"; const [, m, d] = iso.slice(0, 10).split("-"); return `${d}.${m}`; };
const warsawDay = t => new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Warsaw" }).format(t);
const hm = iso => new Intl.DateTimeFormat("pl-PL", { timeZone: "Europe/Warsaw", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
function when(iso) {
  if (!iso) return "—";
  const d = warsawDay(new Date(iso)), today = warsawDay(new Date()), yest = warsawDay(new Date(Date.now() - 86400000));
  const day = d === today ? "dziś" : d === yest ? "wczoraj" : longDate(d);
  return `${day}, ${hm(iso)}`;
}
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const sym = s => esc(String(s).replace(/USDT$/, ""));
const ICON = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/><path d="M10.3 3.9L2.6 17.5A2 2 0 004.3 20.5h15.4a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
  bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
};
const ddLevel = (dd, th) => dd == null ? "info" : dd >= th.stop ? "bad" : dd >= th.warn ? "warn" : "ok";
// Odmiana po liczebniku: odm(n, "przebieg", "przebiegi", "przebiegów") — 1 / 2–4 (też 22–24…) / 5+ i 12–14.
const odm = (n, one, few, many) => n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;
// Kłopot nogi carry (poprawka 12) po ludzku. Zwraca zwykły tekst — kto go wstawia do HTML, sam woła esc().
const CARRY_TROUBLE_TXT = { "spóźnione": "dane o opłatach są spóźnione", "brak pliku": "brak pliku z danymi o opłatach" };
const carryTrouble = s => (s || "").split(", ").filter(Boolean).map(part => {
  if (CARRY_TROUBLE_TXT[part]) return CARRY_TROUBLE_TXT[part];
  const m = /^BŁĄD (.+)$/.exec(part);
  return m ? `błąd liczenia albo zapisu (${m[1]})` : part;
}).join(", ");

function status(D) {
  const ageH = (Date.now() - Date.parse(D.generated_at)) / 3600000;
  const H = D.health, C = D.criteria;
  const r1 = ddLevel(D.r1.drawdown.at(-1), D.thresholds.r1), x1 = D.x1 ? ddLevel(D.x1.drawdown.at(-1), D.thresholds.x1) : "ok";
  if (ageH > 30) return ["bad", `Strona nie odświeżyła się od ${Math.round(ageH)} godzin`, "Liczby poniżej mogą być nieaktualne.", "sprawdź zadanie odświeżania strony w zaplanowanych zadaniach."];
  if (H.latest_as_of !== D.expected_as_of) return ["bad", `Dziennik nie policzył się za ${longDate(D.expected_as_of)}`, "Ostatnie obliczenie jest starsze, niż powinno.", "sprawdź, czy serwer działa i czy zapisuje dziennik do repo."];
  if (r1 === "bad" || x1 === "bad") return ["bad", "Spadek przekroczył próg STOP", "Tak duży spadek zapisano z góry jako moment decyzji.", "zdecyduj, czy przerwać test. Dziennik sam się nie wyłączy."];
  if (C.consistency.after_first_result > 0) return ["bad", "Dziennik zmienił wcześniej zapisane liczby", "Raz zapisane pozycje i wyniki nie powinny się zmieniać.", "trzeba znaleźć przyczynę przed odczytem 25 grudnia."];
  if (r1 === "warn" || x1 === "warn") return ["warn", "Spadek przekroczył próg ostrzeżenia", "Portfel stracił więcej niż w najgorszym okresie w historii testów.", "nic pilnego. Obserwuj; decyzja zapada dopiero przy progu STOP."];
  if (H.hosts_last_day.length > 1) return ["warn", "Wszystko działa, ale dziennik policzyły dwie maszyny", `${longDate(H.last_journal_date)} obliczenie zrobił i serwer, i Twój komputer. Wyniki wyszły takie same.`, "nic, jeśli od następnej nocy liczy już tylko serwer."];
  const car = D.carry;
  if (car?.error) return ["warn", "Nie da się odczytać wyników carry", `Plik z wynikami osobnej nogi carry ma nieoczekiwany kształt (${car.error}). Reszta dziennika liczy się normalnie.`, "sprawdź plik carry_wyniki.csv i najbliższe obliczenie."];
  if (D.last_run?.carry) return ["warn", "Wszystko działa, ale noga carry ma kłopot", `Ostatnie obliczenie zgłosiło: ${carryTrouble(D.last_run.carry)}. Portfele liczą się normalnie.`, "nic pilnego. Jeśli kłopot powtórzy się jutro, sprawdź pobieranie danych o opłatach z Binance."];
  if (car && car.criteria.consistency.last > car.criteria.consistency.prev) return ["warn", "Noga carry: zapis różni się od przeliczenia", "Ostatnie przeliczenie stawek funding nie zgadza się z tym, co już zapisano w carry_wyniki.csv.", "trzeba wyjaśnić przyczynę przed odczytem 25 grudnia, np. czy giełda poprawiła stawkę."];
  return ["ok", "Wszystko działa", "Dziennik liczy się sam każdej nocy i nic nie wymaga Twojej uwagi.", "nic."];
}

function spark(dates, eq, color) {
  const vals = (eq || []).map(v => v ?? NaN);
  if (vals.filter(Number.isFinite).length < 2) return `<p class="empty">Wykres pojawi się od drugiego dnia z wynikiem.</p>`;
  const W = 300, H = 100, P = 6;
  const fin = vals.filter(Number.isFinite), lo = Math.min(1, ...fin), hi = Math.max(1, ...fin);
  const pad = (hi - lo) * .15 || .002, y0 = lo - pad, y1 = hi + pad;
  const X = i => P + i * (W - 2 * P) / (vals.length - 1), Y = v => H - P - (v - y0) * (H - 2 * P) / (y1 - y0);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`), n = vals.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Wartość 100 zł w czasie">
    <line x1="0" x2="${W}" y1="${Y(1)}" y2="${Y(1)}" stroke="var(--ink-3)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="M${X(0)},${Y(1)} L${pts.join(" L")} L${X(n)},${Y(1)} Z" fill="${color}" fill-opacity=".12"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(n)}" cy="${Y(vals[n])}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg><div class="axis"><span>${esc(short(dates[0]))}</span><span>przerywana linia = 100 zł na starcie</span><span>${esc(short(dates[n]))}</span></div>`;
}

function meter(dd, th) {
  const lvl = ddLevel(dd, th), col = { ok: "var(--good)", warn: "var(--warn)", bad: "var(--bad)", info: "var(--ink-3)" }[lvl];
  const w = Math.min(100, Math.max(0, (dd || 0) / th.stop * 100));
  return `<div class="meter"><div class="row"><span class="muted">Spadek od najwyższego stanu</span><span class="num"><b>${pct(dd || 0)}</b></span></div>
    <div class="track"><div class="fill" style="width:${w}%;background:${col}"></div><div class="tick" style="left:${th.warn / th.stop * 100}%;background:var(--warn)"></div><div class="tick" style="right:0;background:var(--bad)"></div></div>
    <div class="lab"><span>0 %</span><span>ostrzeżenie przy ${pct(th.warn)}</span><span>STOP przy ${pct(th.stop)}</span></div></div>`;
}

function portfolioCard({ name, about, color, s, th, start }) {
  const has = s && s.equity && s.equity.length;
  const eq = has ? s.equity.at(-1) : null, dd = has ? s.drawdown.at(-1) : null;
  const lvl = has ? ddLevel(dd, th) : "info";
  const tag = { ok: "w normie", warn: "ostrzeżenie", bad: "STOP", info: "czeka na pierwszy wynik" }[lvl];
  return `<div class="card">
    <div class="row"><h3><span class="swatch" style="background:${color}"></span>${name}</h3><span class="tag ${lvl}">${tag}</span></div>
    <p class="hint">${about}</p>
    ${has ? `<div class="money">${nf(eq * 100, 2)} zł <small>z każdych 100 zł · ${pct(eq - 1, 2, true)}</small></div>
      ${meter(dd, th)}${spark(s.dates, s.equity, color)}`
      : `<p class="empty">Wynik liczy się od ${longDate(start)}. Pierwsza liczba pojawi się po nocnym obliczeniu, które zamknie ten dzień.</p>`}
  </div>`;
}

// Karta nogi carry COIN-M (poprawka 12, tylko zapis — dziennik/README.md). D.carry brak = stary
// generator jeszcze nie zaktualizowany; D.carry.error = plik carry_wyniki.csv nieczytelny.
function carryCard(D) {
  const about = "Na papierze: 1 bitcoin kupiony na giełdzie i taki sam zakład na jego spadek w kontrakcie rozliczanym w bitcoinach. Zmiany ceny się znoszą, zostaje sama opłata funding, którą strony kontraktu płacą sobie co 8 godzin. Bez dźwigni, zawsze w pozycji — tylko do sprawdzenia, czy zapis zgadza się z giełdą.";
  const swatch = `<span class="swatch" style="background:var(--carry)"></span>`;
  const c = D.carry;

  if (!c) {
    return `<div class="card">
      <div class="row"><h3>${swatch}Carry COIN-M</h3></div>
      <p class="hint">${about}</p>
      <p class="empty">Ta część pojawi się po aktualizacji automatu, który odświeża stronę.</p>
    </div>`;
  }
  if (c.error) {
    return `<div class="card">
      <div class="row"><h3>${swatch}Carry COIN-M</h3><span class="tag warn">błąd odczytu</span></div>
      <p class="hint">${about}</p>
      <p class="empty">Nie udało się odczytać pliku wyników carry (${esc(c.error)}). Reszta strony jest aktualna.</p>
    </div>`;
  }

  const last = D.last_run || {};
  const tim = c.criteria.timeliness, comp = c.criteria.completeness, cons = c.criteria.consistency;
  let tag;
  if (last.carry) tag = `<span class="tag warn">kłopot</span>`;
  else if (cons.last > 0) tag = `<span class="tag warn">różnica w zapisie</span>`;
  else if (!c.dates.length) tag = `<span class="tag info">czeka na pierwszy wynik</span>`;
  else tag = `<span class="tag info">tylko zapis</span>`;

  let body;
  if (c.dates.length) {
    const eq = 1 + c.cum.at(-1);
    const eqSeries = c.cum.map(v => v == null ? null : 1 + v);
    body = `<div class="money">${nf(eq * 100, 2)} zł <small>z każdych 100 zł · ${pct(eq - 1, 2, true)}</small></div>
      ${spark(c.dates, eqSeries, "var(--carry)")}
      <p class="hint">Ostatni dzień (${longDate(c.dates.at(-1))}): ${c.settlements.at(-1)} z 3 rozliczeń, opłata ${pct(c.funding.at(-1), 3, true)}.</p>`;
  } else {
    body = `<p class="empty">Wynik liczy się od ${longDate(c.start)}. Pierwsza liczba pojawi się po nocnym obliczeniu, które zamknie ten dzień.</p>`;
  }

  const timOk = tim.runs ? tim.trouble / tim.runs <= 0.05 : null;
  const compDays = comp.days + comp.missing.length;  // dni od startu: brakujący wiersz = dzień niepełny
  const compOk = compDays ? comp.complete / compDays >= 0.95 : null;
  const consOk = cons.runs === 0;
  let compExtra = "";
  if (comp.incomplete.length || comp.missing.length) {
    const bits = [];
    if (comp.incomplete.length) bits.push(`niepełne: ${comp.incomplete.map(short).join(", ")}`);
    if (comp.missing.length) bits.push(`brakujące: ${comp.missing.map(short).join(", ")}`);
    compExtra = `<span class="d" style="display:block">${esc(bits.join(" · "))}</span>`;
  }
  const critRow = (k, v, w, ok, extra = "") => `<div class="it"><span><b>${k}</b><span class="d"><span class="num">${esc(v)}</span> · wymóg: ${w}</span>${extra}</span><span class="tag ${ok == null ? "info" : ok ? "ok" : "warn"}">${ok == null ? "czeka" : ok ? "spełnia" : "do sprawdzenia"}</span></div>`;
  const crit = `<div class="list">
    ${critRow("Na czas", tim.runs ? `${tim.runs - tim.trouble} z ${tim.runs} ${tim.runs === 1 ? "przebiegu" : "przebiegów"} bez kłopotu` : "—", "kłopot najwyżej w 5 % przebiegów od 30 września", timOk)}
    ${critRow("Komplet rozliczeń", compDays ? `${comp.complete} z ${compDays} ${compDays === 1 ? "dnia" : "dni"} po 3 rozliczenia` : "—", "co najmniej 95 % dni, każdy brak wyjaśniony", compOk, compExtra)}
    ${critRow("Zapis zgodny z giełdą", cons.runs ? `${cons.runs} ${odm(cons.runs, "przebieg", "przebiegi", "przebiegów")} z różnicą (najwięcej ${cons.max} ${cons.max === 1 ? "dzień" : "dni"})` : "bez różnic", "zero różnic", consOk)}
  </div>`;

  return `<div class="card">
    <div class="row"><h3>${swatch}Carry COIN-M</h3>${tag}</div>
    <p class="hint">${about}</p>
    ${body}
    ${crit}
  </div>`;
}

    <section><div class="sec-head"><h2>Co portfele trzymają ${P ? "na " + longDate(P.for_day) : ""}</h2><p class="hint">Pozycje wyliczone z cen z końca ${P ? longDate(P.as_of) : "dnia"}.</p></div>${positions}</section>
    <section><div class="sec-head"><h2>Carry — sprawdzian zapisu</h2><p class="hint">Osobna noga od 29 września: tylko zapis opłaty funding, bez wpływu na portfele.</p></div>${carrySec}</section>
    <section><div class="sec-head"><h2>Nastrój rynku</h2><p class="hint">Krótka notatka o tym, jaki był rynek każdego dnia.</p></div>${market}${marketNote}</section>
    <section><div class="sec-head"><h2>Historia obliczeń</h2><p class="hint">Każde nocne obliczenie dziennika, najnowsze na górze.</p></div>${history}</section>
    ${glossary}
    <footer><span>Dane z plików dziennika w repozytorium projektu, pobierane raz dziennie około 8:30.${stale ? " Ostatnie odświeżenie się nie udało." : ""}</span><span>Strona tylko pokazuje dziennik — niczego nie liczy od nowa i niczego w nim nie zmienia.</span></footer>
  </div>`;
}

function showState(title, text) {
  document.getElementById("fresh").textContent = "brak danych";
  document.getElementById("app").innerHTML = `<div class="hero t-warn"><div class="ico">${ICON.warn}</div><div><h1>${esc(title)}</h1><p class="muted" style="margin-top:6px">${esc(text)}</p></div></div>`;
}

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) return showState("Nie mogę wczytać danych", "Ten widok nie ma dostępu do danych strony. Otwórz ją w Claude jako zalogowany użytkownik.");
  db.doc("dziennik/stan").onSnapshot(
    snap => {
      if (!snap.exists) return showState("Czekam na pierwsze odświeżenie", "Dane dziennika pojawią się po najbliższym odświeżeniu strony.");
      try { render(snap.data()); } catch (e) { showState("Nie udało się pokazać danych", "Zapisane dane mają nieoczekiwany kształt: " + e.message); }
    },
    () => showState("Nie udało się wczytać danych", "Odśwież stronę za chwilę.")
  );
})();
</script>
